<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Vencimientos - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0 auto;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px}
    h1,h2{color:#c9a24b}
    input,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    button.sec{background:#1a1a1a}
    a{color:#c9a24b}
    .caja{background:#fff;border:1px solid #eadfc8;border-radius:12px;padding:12px;margin:10px 0}
    .caja.vencida{border-left:5px solid #c0392b}
    .caja.vigente{border-left:5px solid #4caf50}
    .caja button{width:auto;padding:8px 12px;margin:4px 4px 0 0;font-size:.9rem}
    .caja input{margin-top:8px}
    .msg{min-height:1.4em}
  </style>
</head>
<body>
  <h1>Vencimientos</h1>
  <p><a href="dashboard.html">Menú</a> - <a href="admin.html">Invitaciones</a></p>

  <section id="login">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btn-login" type="button">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <p>Después de la fecha elegida (hasta las 23:59), la invitación deja de verse y de recibir confirmaciones. Vos y el cliente siguen viéndola en los paneles. La fecha propuesta es 30 días después del evento.</p>
    <p id="msg" class="msg"></p>
    <div id="lista"></div>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, updateDoc, deleteField, Timestamp, collection, getDocs }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);

    $("btn-login").addEventListener("click", async () => {
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
      } catch (e) { $("login-msg").textContent = "Email o contraseña incorrectos."; }
    });
    onAuthStateChanged(auth, (u) => {
      $("login").hidden = !!u;
      $("panel").hidden = !u;
      if (u) cargar();
    });

    const iso = (d) => d.toLocaleDateString("sv-SE");
    const bonita = (d) => d.toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" });

    function sugerida(x) {
      if (x.expiresAt && x.expiresAt.toDate) return iso(x.expiresAt.toDate());
      if (x.date) {
        const d = new Date(x.date + "T00:00:00");
        d.setDate(d.getDate() + 30);
        return iso(d);
      }
      return "";
    }

    async function cargar() {
      const cont = $("lista");
      cont.textContent = "Cargando...";
      try {
        const snap = await getDocs(collection(db, "invitations"));
        cont.textContent = "";
        if (snap.empty) { cont.textContent = "No hay invitaciones."; return; }
        const filas = snap.docs.map((d) => ({ id: d.id, x: d.data() }))
          .sort((a, b) => (a.x.honoree || a.id).localeCompare(b.x.honoree || b.id, "es"));
        filas.forEach(({ id, x }) => cont.appendChild(fila(id, x)));
      } catch (e) {
        console.error(e);
        cont.textContent = "No se pudieron cargar las invitaciones.";
      }
    }

    function fila(id, x) {
      const t = document.createElement("div");
      t.className = "caja";
      const n = document.createElement("b"); n.textContent = x.honoree || id;
      const ev = document.createElement("div");
      ev.textContent = "Evento: " + (x.date || "sin fecha");
      const est = document.createElement("div");

      if (x.expiresAt && x.expiresAt.toDate) {
        const f = x.expiresAt.toDate();
        const vencida = f < new Date();
        est.textContent = (vencida ? "Vencida el " : "Vence el ") + bonita(f);
        t.classList.add(vencida ? "vencida" : "vigente");
      } else {
        est.textContent = "Sin vencimiento";
      }

      const inp = document.createElement("input");
      inp.type = "date"; inp.value = sugerida(x);

      const guardar = document.createElement("button");
      guardar.type = "button"; guardar.textContent = "Guardar vencimiento";
      guardar.onclick = async () => {
        if (!inp.value) { $("msg").textContent = "Elegí una fecha."; return; }
        try {
          await updateDoc(doc(db, "invitations", id), {
            expiresAt: Timestamp.fromDate(new Date(inp.value + "T23:59:59"))
          });
          $("msg").textContent = "Vencimiento guardado para " + (x.honoree || id) + ".";
          cargar();
        } catch (e) { console.error(e); $("msg").textContent = "No se pudo guardar."; }
      };

      const quitar = document.createElement("button");
      quitar.type = "button"; quitar.className = "sec"; quitar.textContent = "Quitar vencimiento";
      quitar.onclick = async () => {
        try {
          await updateDoc(doc(db, "invitations", id), { expiresAt: deleteField() });
          $("msg").textContent = "Vencimiento quitado de " + (x.honoree || id) + ".";
          cargar();
        } catch (e) { console.error(e); $("msg").textContent = "No se pudo quitar."; }
      };

      t.append(n, ev, est, inp, guardar);
      if (x.expiresAt) t.appendChild(quitar);
      return t;
    }
  </script>
</body>
</html>
