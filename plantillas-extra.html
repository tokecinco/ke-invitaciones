<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Plantillas nuevas - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0 auto;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px}
    h1,h2{color:#c9a24b}
    input,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    a{color:#c9a24b}
    .caja{background:#fff;border:1px solid #eadfc8;border-radius:12px;padding:12px;margin:10px 0}
    .muestra{display:flex;gap:6px;margin-top:6px}
    .muestra span{flex:1;height:26px;border-radius:6px;border:1px solid #ddd}
    .msg{min-height:1.4em}
  </style>
</head>
<body>
  <h1>Plantillas nuevas</h1>
  <p><a href="plantillas.html">Plantillas</a> - <a href="dashboard.html">Menú</a></p>

  <section id="login">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btn-login" type="button">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <p>Cargá plantillas ya armadas. Las que ya existan no se tocan. Después podés editarlas en Plantillas.</p>
    <div id="lista"></div>
    <button id="btn-cargar" type="button">Cargar todas</button>
    <p id="msg" class="msg"></p>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, setDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    const TODAS = ["portada", "mensaje", "cuenta", "lugar", "info", "galeria", "rsvp", "compartir"];

    const NUEVAS = [
      { id: "babyshower-nina", name: "Baby shower niña", category: "babyshower",
        font: "'Trebuchet MS', sans-serif", deco: "corazones",
        colors: { fondo: "#fff6f9", texto: "#4a3b42", acento: "#e08fb0", suave: "#fde3ee" } },
      { id: "babyshower-nino", name: "Baby shower niño", category: "babyshower",
        font: "'Trebuchet MS', sans-serif", deco: "estrellas",
        colors: { fondo: "#f4f9ff", texto: "#364150", acento: "#6aa6d6", suave: "#dcebfa" } },
      { id: "babyshower-neutro", name: "Baby shower neutro", category: "babyshower",
        font: "'Trebuchet MS', sans-serif", deco: "nubes",
        colors: { fondo: "#f7fbf6", texto: "#3f4a3f", acento: "#8fb996", suave: "#e3f1e4" } }
    ];

    $("btn-login").addEventListener("click", async () => {
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
      } catch (e) { $("login-msg").textContent = "Email o contraseña incorrectos."; }
    });
    onAuthStateChanged(auth, (u) => {
      $("login").hidden = !!u;
      $("panel").hidden = !u;
      if (u) dibujar();
    });

    function dibujar() {
      const cont = $("lista");
      cont.textContent = "";
      NUEVAS.forEach((p) => {
        const c = document.createElement("div"); c.className = "caja";
        const n = document.createElement("b"); n.textContent = p.name;
        const m = document.createElement("div"); m.className = "muestra";
        ["fondo", "suave", "acento", "texto"].forEach((k) => {
          const s = document.createElement("span"); s.style.background = p.colors[k]; m.appendChild(s);
        });
        c.append(n, m);
        cont.appendChild(c);
      });
    }

    $("btn-cargar").addEventListener("click", async () => {
      $("msg").textContent = "Cargando...";
      try {
        let creadas = 0;
        for (const p of NUEVAS) {
          const ex = await getDoc(doc(db, "templates", p.id));
          if (ex.exists()) continue;
          await setDoc(doc(db, "templates", p.id), {
            name: p.name, category: p.category, font: p.font, colors: p.colors,
            deco: p.deco, sections: TODAS, sampleImage: "", active: true,
            createdAt: serverTimestamp()
          });
          creadas++;
        }
        $("msg").textContent = creadas
          ? "Se cargaron " + creadas + " plantilla(s)."
          : "Esas plantillas ya estaban cargadas.";
      } catch (e) {
        console.error(e);
        $("msg").textContent = "No se pudo cargar.";
      }
    });
  </script>
</body>
</html>
