<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Plantillas prearmadas - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0 auto;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px}
    h1,h2{color:#c9a24b}
    h2{margin:22px 0 6px;font-size:1.1rem}
    input,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    a{color:#c9a24b}
    .caja{background:#fff;border:1px solid #eadfc8;border-radius:12px;padding:12px;margin:8px 0}
    .muestra{display:flex;gap:6px;margin-top:6px}
    .muestra span{flex:1;height:26px;border-radius:6px;border:1px solid #ddd}
    .msg{min-height:1.4em}
  </style>
</head>
<body>
  <h1>Plantillas prearmadas</h1>
  <p><a href="plantillas.html">Plantillas</a> - <a href="dashboard.html">Menú</a></p>

  <section id="login">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btn-login" type="button">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <p>Cargá plantillas ya armadas. Las que ya existan no se tocan. Después podés editarlas en Plantillas.</p>
    <button id="btn-cargar" type="button">Cargar todas</button>
    <p id="msg" class="msg"></p>
    <div id="lista"></div>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, setDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    const TODAS = ["portada", "mensaje", "cuenta", "lugar", "info", "galeria", "rsvp", "compartir"];
    // Pase QR: sin galería (solo portada). "compartir" se mantiene porque ahí se arma el cierre "Nos vemos en".
    const PASE_SEC = ["portada", "mensaje", "cuenta", "lugar", "info", "rsvp", "compartir"];
    const PALATINO = "'Palatino Linotype', Palatino, serif";
    const TREBUCHET = "'Trebuchet MS', sans-serif";
    const GEORGIA = "Georgia, serif";
    const VERDANA = "Verdana, sans-serif";
    const TIMES = "'Times New Roman', serif";

    const NUEVAS = [
      /* Baby shower */
      { id: "babyshower-nina", name: "Baby shower niña", category: "babyshower",
        font: TREBUCHET, deco: "corazones",
        colors: { fondo: "#fff6f9", texto: "#4a3b42", acento: "#e08fb0", suave: "#fde3ee" } },
      { id: "babyshower-nino", name: "Baby shower niño", category: "babyshower",
        font: TREBUCHET, deco: "estrellas",
        colors: { fondo: "#f4f9ff", texto: "#364150", acento: "#6aa6d6", suave: "#dcebfa" } },
      { id: "babyshower-neutro", name: "Baby shower neutro", category: "babyshower",
        font: TREBUCHET, deco: "nubes",
        colors: { fondo: "#f7fbf6", texto: "#3f4a3f", acento: "#8fb996", suave: "#e3f1e4" } },

      /* Casamientos */
      { id: "boda-moderna-salvia", name: "Casamiento moderno salvia", category: "boda",
        font: PALATINO, fondo: "boda-salvia",
        colors: { fondo: "#faf7f1", texto: "#34382f", acento: "#6f8265", suave: "#ece9df" } },
      { id: "boda-moderna-terracota", name: "Casamiento moderno terracota", category: "boda",
        font: PALATINO, fondo: "boda-terracota",
        colors: { fondo: "#fbf5ee", texto: "#3b2f2a", acento: "#b0654a", suave: "#f1e4da" } },
      { id: "boda-noche", name: "Casamiento romántico noche", category: "boda",
        font: PALATINO, fondo: "noche",
        colors: { fondo: "#0f1b2d", texto: "#f3ead8", acento: "#c9a24b", suave: "#1b2b44" } },
      { id: "boda-boho", name: "Casamiento boho", category: "boda",
        font: GEORGIA, fondo: "boho",
        colors: { fondo: "#fbf4ea", texto: "#4a3a2e", acento: "#b9714f", suave: "#f0e0cf" } },

      /* 15 años */
      { id: "quince-princesa", name: "15 años princesa rosa y dorado", category: "quince",
        font: GEORGIA, fondo: "princesa",
        colors: { fondo: "#fff5f8", texto: "#5a3a46", acento: "#b8860b", suave: "#fde0ea" } },
      { id: "quince-lila", name: "15 años lila con mariposas", category: "quince",
        font: PALATINO, fondo: "lila",
        colors: { fondo: "#f7f2fc", texto: "#4b3a63", acento: "#8e63c8", suave: "#e9ddf6" } },
      { id: "quince-glam", name: "15 años glam rosé", category: "quince",
        font: TREBUCHET, fondo: "glam",
        colors: { fondo: "#fcf3ef", texto: "#4a2f2c", acento: "#b76e79", suave: "#f4dcd8" } },

      /* Pase QR */
      { id: "pase-negro-dorado", name: "Pase negro y dorado", category: "pase",
        font: PALATINO, fondo: "noche", sections: PASE_SEC,
        colors: { fondo: "#121212", texto: "#f4ecd8", acento: "#c9a24b", suave: "#1f1f1f" } },
      { id: "pase-fiesta-neon", name: "Pase fiesta neón", category: "pase",
        font: TREBUCHET, deco: "estrellas", sections: PASE_SEC,
        colors: { fondo: "#140a24", texto: "#f5eaff", acento: "#ff4fa3", suave: "#2a1545" } },
      { id: "pase-minimal", name: "Pase minimal blanco", category: "pase",
        font: GEORGIA, sections: PASE_SEC,
        colors: { fondo: "#ffffff", texto: "#222222", acento: "#111111", suave: "#f1f1f1" } },
      { id: "pase-graduacion", name: "Pase graduación azul y dorado", category: "pase",
        font: PALATINO, sections: PASE_SEC,
        colors: { fondo: "#f3f6fb", texto: "#1f2a44", acento: "#b8860b", suave: "#dfe7f5" } },
      { id: "pase-verano", name: "Pase verano coral", category: "pase",
        font: TREBUCHET, sections: PASE_SEC,
        colors: { fondo: "#fff8ee", texto: "#3d3a35", acento: "#e8574d", suave: "#d9f1ee" } },
      { id: "pase-corporativo", name: "Pase evento corporativo", category: "pase",
        font: VERDANA, sections: PASE_SEC,
        colors: { fondo: "#f5f7fa", texto: "#1d2733", acento: "#2f6fb2", suave: "#e0e9f4" } },

      /* Aniversarios */
      { id: "aniversario-bordo", name: "Aniversario bordó y dorado", category: "aniversario",
        font: PALATINO, fondo: "noche",
        colors: { fondo: "#3a0f1c", texto: "#f6e7e0", acento: "#d9b26f", suave: "#541a2b" } },
      { id: "aniversario-bordo-claro", name: "Aniversario bordó claro", category: "aniversario",
        font: GEORGIA,
        colors: { fondo: "#fdf6f4", texto: "#3b1f26", acento: "#7a1f35", suave: "#f3dfe0" } },
      { id: "aniversario-bodas-plata", name: "Bodas de plata", category: "aniversario",
        font: PALATINO, deco: "estrellas",
        colors: { fondo: "#f5f6f8", texto: "#2b2f36", acento: "#6b7683", suave: "#e3e7ec" } },
      { id: "aniversario-bodas-oro", name: "Bodas de oro", category: "aniversario",
        font: GEORGIA, deco: "estrellas",
        colors: { fondo: "#fffaf0", texto: "#3a2e12", acento: "#b8860b", suave: "#f6e9c8" } },
      { id: "aniversario-romantico", name: "Aniversario romántico rosa", category: "aniversario",
        font: GEORGIA, deco: "corazones",
        colors: { fondo: "#fff5f6", texto: "#4a2b33", acento: "#c2506b", suave: "#fbdde3" } },
      { id: "aniversario-esmeralda", name: "Aniversario esmeralda", category: "aniversario",
        font: PALATINO,
        colors: { fondo: "#f3f8f5", texto: "#1f3a2f", acento: "#2f7d5b", suave: "#dcece3" } },
      { id: "aniversario-vintage", name: "Aniversario vintage", category: "aniversario",
        font: TIMES,
        colors: { fondo: "#f7efe2", texto: "#4a3a2a", acento: "#a0643a", suave: "#ecdcc4" } },

      /* Cumpleaños infantiles */
      { id: "cumple-dinosaurios", name: "Cumpleaños dinosaurios", category: "cumpleanos",
        font: TREBUCHET,
        colors: { fondo: "#f6f3e4", texto: "#33401f", acento: "#4f8a2b", suave: "#e3efc9" } },
      { id: "cumple-safari", name: "Cumpleaños safari", category: "cumpleanos",
        font: TREBUCHET,
        colors: { fondo: "#fbf3e0", texto: "#4a3a1f", acento: "#c47a1c", suave: "#f1e0b8" } },
      { id: "cumple-espacio", name: "Cumpleaños espacio", category: "cumpleanos",
        font: TREBUCHET, deco: "estrellas",
        colors: { fondo: "#0d1330", texto: "#eef0ff", acento: "#7aa2ff", suave: "#1a2250" } },
      { id: "cumple-unicornio", name: "Cumpleaños unicornio", category: "cumpleanos",
        font: TREBUCHET, deco: "nubes",
        colors: { fondo: "#fdf4fb", texto: "#5a3a63", acento: "#b565c9", suave: "#f5dff3" } },
      { id: "cumple-superheroes", name: "Cumpleaños superhéroes", category: "cumpleanos",
        font: VERDANA,
        colors: { fondo: "#f3f6ff", texto: "#1c2540", acento: "#d62839", suave: "#dfe6fb" } },

      /* Bautismos */
      { id: "bautismo-celeste", name: "Bautismo celeste", category: "bautismo",
        font: GEORGIA, deco: "nubes",
        colors: { fondo: "#f4f9ff", texto: "#33475b", acento: "#5b9bd5", suave: "#dcebfa" } },
      { id: "bautismo-rosa", name: "Bautismo rosa", category: "bautismo",
        font: GEORGIA, deco: "nubes",
        colors: { fondo: "#fff6f8", texto: "#5a3f47", acento: "#d9849f", suave: "#fbe1e9" } },
      { id: "bautismo-blanco-dorado", name: "Bautismo blanco y dorado", category: "bautismo",
        font: PALATINO, deco: "estrellas",
        colors: { fondo: "#ffffff", texto: "#3a3426", acento: "#b8963e", suave: "#f6f0df" } },
      { id: "bautismo-verde-suave", name: "Bautismo verde suave", category: "bautismo",
        font: GEORGIA, deco: "nubes",
        colors: { fondo: "#f6faf4", texto: "#3a4a38", acento: "#7da27a", suave: "#e2eedd" } }
    ];

    const CATEGORIAS_BASE = [
      ["cumpleanos", "Cumpleaños infantiles"], ["quince", "15 años"], ["boda", "Casamientos"],
      ["bautismo", "Bautismos"], ["babyshower", "Baby shower"], ["aniversario", "Aniversarios"],
      ["especial", "Eventos especiales"], ["pase", "Pase QR"]
    ];
    const NOMBRE_CAT = {};
    CATEGORIAS_BASE.forEach(([id, n]) => { NOMBRE_CAT[id] = n; });

    $("btn-login").addEventListener("click", async () => {
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
      } catch (e) { $("login-msg").textContent = "Email o contraseña incorrectos."; }
    });
    onAuthStateChanged(auth, (u) => {
      $("login").hidden = !!u;
      $("panel").hidden = !u;
      if (u) dibujar();
    });

    // La lista se muestra agrupada por categoría
    function dibujar() {
      const cont = $("lista");
      cont.textContent = "";
      const orden = [];
      NUEVAS.forEach((p) => { if (!orden.includes(p.category)) orden.push(p.category); });
      orden.forEach((cat) => {
        const h = document.createElement("h2");
        h.textContent = NOMBRE_CAT[cat] || cat;
        cont.appendChild(h);
        NUEVAS.filter((p) => p.category === cat).forEach((p) => {
          const c = document.createElement("div"); c.className = "caja";
          const n = document.createElement("b"); n.textContent = p.name;
          const m = document.createElement("div"); m.className = "muestra";
          ["fondo", "suave", "acento", "texto"].forEach((x) => {
            const s = document.createElement("span"); s.style.background = p.colors[x]; m.appendChild(s);
          });
          c.append(n, m);
          cont.appendChild(c);
        });
      });
    }

    // Se asegura de que existan las categorías de las plantillas que se acaban de crear.
    // Devuelve los nombres de las categorías que tuvo que agregar.
    async function asegurarCategorias(ids) {
      if (!ids.length) return [];
      const ref = doc(db, "settings", "categories");
      const s = await getDoc(ref);
      let items;
      if (s.exists() && Array.isArray(s.data().items)) {
        items = s.data().items.slice();
      } else {
        items = CATEGORIAS_BASE.map(([id, name]) => ({ id: id, name: name }));
        await setDoc(ref, { items: items, updatedAt: serverTimestamp() });
        return [];
      }
      const agregadas = [];
      ids.forEach((id) => {
        if (items.some((c) => c && c.id === id)) return;
        items.push({ id: id, name: NOMBRE_CAT[id] || id });
        agregadas.push(NOMBRE_CAT[id] || id);
      });
      if (agregadas.length) await setDoc(ref, { items: items, updatedAt: serverTimestamp() });
      return agregadas;
    }

    $("btn-cargar").addEventListener("click", async () => {
      $("msg").textContent = "Cargando...";
      try {
        let creadas = 0;
        const cats = [];
        for (const p of NUEVAS) {
          const ex = await getDoc(doc(db, "templates", p.id));
          if (ex.exists()) continue;
          const datos = {
            name: p.name, category: p.category, font: p.font, colors: p.colors,
            sections: p.sections || TODAS, sampleImage: "", active: true, createdAt: serverTimestamp()
          };
          if (p.deco) datos.deco = p.deco;
          if (p.fondo) datos.fondo = p.fondo;
          await setDoc(doc(db, "templates", p.id), datos);
          creadas++;
          if (!cats.includes(p.category)) cats.push(p.category);
        }
        const nuevas = await asegurarCategorias(cats);
        $("msg").textContent = (creadas
          ? "Se cargaron " + creadas + " plantilla(s)."
          : "Esas plantillas ya estaban cargadas.") +
          (nuevas.length ? " Se agregó la categoría: " + nuevas.join(", ") + "." : "");
      } catch (e) {
        console.error(e);
        $("msg").textContent = "No se pudo cargar.";
      }
    });
  </script>
</body>
</html>
