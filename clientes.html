<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Clientes - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0 auto;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px}
    h1,h2{color:#c9a24b}
    input,select,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    button.sec{background:#1a1a1a}
    label{font-size:.9rem;display:block;margin-top:8px}
    a{color:#c9a24b}
    .caja{background:#fff;border:1px solid #eadfc8;border-radius:12px;padding:12px;margin:10px 0}
    .msg{min-height:1.4em}
  </style>
</head>
<body>
  <h1>Clientes</h1>
  <p><a href="admin.html">Panel</a> - <a href="pagos.html">Pagos</a></p>

  <section id="login">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btn-login" type="button">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <h2>Vincular invitación a un cliente</h2>
    <div class="caja">
      <label>Invitación</label>
      <select id="sel-inv"></select>
      <label>Cliente (cuentas registradas)</label>
      <select id="sel-cli"></select>
      <button id="btn-vincular" type="button">Vincular</button>
      <button id="btn-quitar" class="sec" type="button">Quitar vínculo (vuelve a ser tuya)</button>
      <p id="msg" class="msg"></p>
    </div>

    <h2>Estado actual</h2>
    <div id="lista"></div>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, updateDoc, collection, getDocs }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    let usuarios = {};
    let invitaciones = {};

    $("btn-login").addEventListener("click", async () => {
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
      } catch (e) {
        $("login-msg").textContent = "Email o contraseña incorrectos.";
      }
    });

    onAuthStateChanged(auth, (u) => {
      $("login").hidden = !!u;
      $("panel").hidden = !u;
      if (u) cargar();
    });

    async function cargar() {
      try {
        const [us, inv] = await Promise.all([
          getDocs(collection(db, "users")),
          getDocs(collection(db, "invitations"))
        ]);
        usuarios = {}; invitaciones = {};
        us.forEach((d) => { usuarios[d.id] = d.data().email || d.id; });
        inv.forEach((d) => { invitaciones[d.id] = d.data(); });

        const actual = $("sel-inv").value;
        $("sel-inv").innerHTML = "";
        Object.keys(invitaciones).forEach((id) => {
          const o = document.createElement("option");
          o.value = id;
          o.textContent = (invitaciones[id].honoree || id) + " (" + id + ")";
          $("sel-inv").appendChild(o);
        });
        if (actual && invitaciones[actual]) $("sel-inv").value = actual;

        $("sel-cli").innerHTML = "";
        Object.keys(usuarios).forEach((uid) => {
          if (uid === auth.currentUser.uid) return;
          const o = document.createElement("option");
          o.value = uid;
          o.textContent = usuarios[uid];
          $("sel-cli").appendChild(o);
        });
        if (!$("sel-cli").options.length) {
          const o = document.createElement("option");
          o.value = ""; o.textContent = "Todavía no hay clientes registrados";
          $("sel-cli").appendChild(o);
        }
        dibujar();
      } catch (e) {
        console.error(e);
        $("lista").textContent = "No se pudieron cargar los datos.";
      }
    }

    function dibujar() {
      const cont = $("lista");
      cont.textContent = "";
      const ids = Object.keys(invitaciones);
      if (!ids.length) { cont.textContent = "No hay invitaciones."; return; }
      ids.forEach((id) => {
        const x = invitaciones[id];
        const t = document.createElement("div"); t.className = "caja";
        const n = document.createElement("b"); n.textContent = x.honoree || id;
        const d = document.createElement("div");
        const dueno = x.ownerId === auth.currentUser.uid
          ? "Sin cliente (es tuya)"
          : "Cliente: " + (usuarios[x.ownerId] || "cuenta desconocida");
        d.textContent = dueno;
        t.append(n, d);
        cont.appendChild(t);
      });
    }

    async function asignar(id, nuevoOwner) {
      await updateDoc(doc(db, "invitations", id), { ownerId: nuevoOwner });
      const p = await getDoc(doc(db, "payments", id));
      if (p.exists()) await updateDoc(doc(db, "payments", id), { ownerId: nuevoOwner });
    }

    $("btn-vincular").addEventListener("click", async () => {
      const id = $("sel-inv").value;
      const uid = $("sel-cli").value;
      if (!id || !uid) { $("msg").textContent = "Elegí una invitación y un cliente."; return; }
      $("msg").textContent = "Vinculando...";
      try {
        await asignar(id, uid);
        $("msg").textContent = "Listo: " + (invitaciones[id].honoree || id) + " quedó vinculada a " + usuarios[uid] + ".";
        await cargar();
      } catch (e) {
        console.error(e);
        $("msg").textContent = "No se pudo vincular.";
      }
    });

    $("btn-quitar").addEventListener("click", async () => {
      const id = $("sel-inv").value;
      if (!id) return;
      $("msg").textContent = "Quitando vínculo...";
      try {
        await asignar(id, auth.currentUser.uid);
        $("msg").textContent = "Listo: la invitación volvió a ser tuya.";
        await cargar();
      } catch (e) {
        console.error(e);
        $("msg").textContent = "No se pudo quitar el vínculo.";
      }
    });
  </script>
</body>
</html>
