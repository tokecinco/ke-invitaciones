<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KE Invitaciones</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center;
      justify-content:center; background:#fffaf3; color:#1a1a1a;
      font-family:Georgia,serif; text-align:center; padding:20px; }
  </style>
</head>
<body>
  <p id="msg">Abriendo invitación...</p>
  <script>
    const partes = location.pathname.split("/").filter(Boolean);
    const i = partes.indexOf("i");
    const base = i > 0 ? "/" + partes.slice(0, i).join("/") : "";
    if (i !== -1 && partes[i + 1]) {
      location.replace(base + "/invitacion.html?i=" + encodeURIComponent(partes[i + 1]));
    } else {
      document.getElementById("msg").innerHTML =
        'Página no encontrada. <a href="' + (base || "/") + '">Ir al inicio</a>';
    }
  </script>
</body>
</html>
