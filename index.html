<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KE Invitaciones</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fffaf3;
      color: #1a1a1a;
      font-family: Georgia, serif;
      text-align: center;
      padding: 20px;
    }
    h1 { color: #c9a24b; font-size: 2.2rem; margin-bottom: 8px; }
    p { margin: 6px 0; }
    #estado { margin-top: 24px; padding: 10px 18px; border-radius: 20px; background: #f6dde2; }
  </style>
</head>
<body>
  <h1>KE Invitaciones</h1>
  <p>Una invitación especial para un momento inolvidable.</p>
  <div id="estado">Probando conexión...</div>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    const estado = document.getElementById("estado");
    if (db && auth) {
      estado.textContent = "Firebase conectado ✓";
    } else {
      estado.textContent = "Error de conexión";
    }
  </script>
</body>
</html>
