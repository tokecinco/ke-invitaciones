<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Confirmaciones - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0 auto;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px}
    h1,h2{color:#c9a24b}
    input,select,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    a{color:#c9a24b}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
    .stat{background:#f6dde2;border-radius:12px;padding:12px;text-align:center}
    .stat b{display:block;font-size:1.7rem;color:#8a6a1f}
    .resp{background:#fff;border:1px solid #eadfc8;border-radius:12px;padding:10px;margin:8px 0}
    .si{border-left:5px solid #4caf50}
    .no{border-left:5px solid #c0392b}
    .msg{min-height:1.4em}
  </style>
</head>
<body>
  <h1>Confirmaciones</h1>
  <p><a href="admin.html">Volver al panel</a></p>

  <section id="login">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btn-login" type="button">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <select id="sel"></select>
    <div class="stats">
      <div class="stat"><b id="s-conf">0</b>Confirmaron</div>
      <div class="stat"><b id="s-pers">0</b>Personas en total</div>
      <div class="stat"><b id="s-no">0</b>No asisten</div>
      <div class="stat"><b id="s-msj">0</b>Mensajes</div>
    </div>
    <h2>Respuestas</h2>
    <div id="lista"></div>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { collection, getDocs, query, where }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);

    $("btn-login").addEventListener("click", async () => {
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
      } catch (e) {
        $("login-msg").textContent = "Email o contraseña incorrectos.";
      }
    });

    onAuthStateChanged(auth, (u) => {
      $("login").hidden = !!u;
      $("panel").hidden = !u;
      if (u) cargarInvitaciones();
    });

    async function cargarInvitaciones() {
      try {
        const snap = await getDocs(collection(db, "invitations"));
        $("sel").innerHTML = "";
        snap.forEach((d) => {
          const o = document.createElement("option");
          o.value = d.id;
          o.textContent = (d.data().honoree || d.id) + " (" + d.id + ")";
          $("sel").appendChild(o);
        });
        if (snap.empty) { $("lista").textContent = "No hay invitaciones."; return; }
        const pedida = new URLSearchParams(location.search).get("i");
        if (pedida) $("sel").value = pedida;
        cargarRespuestas();
      } catch (e) {
        console.error(e);
        $("lista").textContent = "No se pudieron cargar las invitaciones.";
      }
    }

    $("sel").addEventListener("change", cargarRespuestas);

    async function cargarRespuestas() {
      const id = $("sel").value;
      const cont = $("lista");
      cont.textContent = "Cargando...";
      try {
        const snap = await getDocs(query(collection(db, "rsvps"), where("invitationId", "==", id)));
        const lista = snap.docs.map((d) => d.data());
        lista.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

        let conf = 0, pers = 0, no = 0, msj = 0;
        cont.textContent = "";
        lista.forEach((r) => {
          if (r.attending) { conf++; pers += r.guests || 0; } else { no++; }
          if (r.message) msj++;
          const t = document.createElement("div");
          t.className = "resp " + (r.attending ? "si" : "no");
          const n = document.createElement("b"); n.textContent = r.name;
          const e = document.createElement("div");
          e.textContent = r.attending ? "Asiste - " + r.guests + " persona(s)" : "No asiste";
          t.append(n, e);
          if (r.message) {
            const m = document.createElement("i");
            m.textContent = "“" + r.message + "”";
            t.appendChild(m);
          }
          cont.appendChild(t);
        });
        if (!lista.length) cont.textContent = "Todavía no hay respuestas.";
        $("s-conf").textContent = conf;
        $("s-pers").textContent = pers;
        $("s-no").textContent = no;
        $("s-msj").textContent = msj;
      } catch (e) {
        console.error(e);
        cont.textContent = "No se pudieron cargar las respuestas.";
      }
    }
  </script>
</body>
</html>
