<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Accesos por código - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0 auto;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px}
    h1,h2{color:#c9a24b}
    input,select,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    button.sec{background:#1a1a1a}
    button.rojo{background:#c0392b}
    label{font-size:.9rem;display:block;margin-top:8px}
    a{color:#c9a24b}
    .caja{background:#fff;border:1px solid #eadfc8;border-radius:12px;padding:12px;margin:12px 0}
    .msg{min-height:1.4em}
  </style>
</head>
<body>
  <h1>Accesos por código</h1>
  <p><a href="dashboard.html">Menú</a> - <a href="clientes.html">Cuentas de clientes</a></p>

  <section id="login">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btn-login" type="button">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <p>Generá códigos para entrar <b>sin cuenta</b>. Se envían por WhatsApp.</p>
    <label>Invitación</label>
    <select id="sel"></select>
    <p id="msg" class="msg"></p>
    <div id="bloques"></div>
    <button id="btn-salir" type="button" class="sec">Cerrar sesión</button>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, setDoc, updateDoc, deleteDoc, deleteField, collection, getDocs, query, where, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    const CAR = "abcdefghjkmnpqrstuvwxyz23456789";
    let invs = {};
    let sec = { code: "", doorCode: "" };

    $("btn-login").addEventListener("click", async () => {
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
      } catch (e) { $("login-msg").textContent = "Email o contraseña incorrectos."; }
    });
    $("btn-salir").addEventListener("click", () => signOut(auth));
    onAuthStateChanged(auth, (u) => {
      $("login").hidden = !!u;
      $("panel").hidden = !u;
      if (u) cargar();
    });

    function nuevoCodigo() {
      const a = new Uint8Array(12);
      crypto.getRandomValues(a);
      return Array.from(a, (b) => CAR[b % CAR.length]).join("");
    }
    const base = () => location.origin + location.pathname.replace(/[^/]*$/, "");

    const TIPOS = [
      {
        campo: "code", coleccion: "grants", titulo: "Panel del cliente",
        texto: "Para que el cliente vea las confirmaciones, el pago, el álbum y el libro de mensajes de su invitación.",
        enlace: (id, c) => base() + "cliente.html?i=" + encodeURIComponent(id) + "&c=" + encodeURIComponent(c),
        mensaje: (l) => "Hola! Este es el enlace de tu panel para ver las confirmaciones y administrar tu invitación: " + l
      },
      {
        campo: "doorCode", coleccion: "doorGrants", titulo: "Control de acceso (puerta)",
        texto: "Para quien controla el ingreso: solo puede escanear QR, ver la lista de invitados y registrar ingresos.",
        enlace: (id, c) => base() + "acceso.html?i=" + encodeURIComponent(id) + "&d=" + encodeURIComponent(c),
        mensaje: (l) => "Hola! Este es el enlace para controlar el acceso al evento. Abrilo desde tu celular y tocá \"Escanear QR\" en la puerta: " + l
      }
    ];

    async function cargar() {
      try {
        const snap = await getDocs(collection(db, "invitations"));
        invs = {};
        $("sel").innerHTML = "";
        snap.forEach((d) => {
          invs[d.id] = d.data();
          const o = document.createElement("option");
          o.value = d.id; o.textContent = (d.data().honoree || d.id) + " (" + d.id + ")";
          $("sel").appendChild(o);
        });
        const pedida = new URLSearchParams(location.search).get("i");
        if (pedida && invs[pedida]) $("sel").value = pedida;
        if (!snap.size) { $("msg").textContent = "No hay invitaciones."; return; }
        elegir();
      } catch (e) {
        console.error(e);
        $("msg").textContent = "No se pudieron cargar las invitaciones.";
      }
    }
    $("sel").addEventListener("change", elegir);

    async function elegir() {
      const id = $("sel").value;
      if (!id) return;
      $("msg").textContent = "";
      sec = { code: "", doorCode: "" };
      try {
        const s = await getDoc(doc(db, "secrets", id));
        if (s.exists()) sec = { code: s.data().code || "", doorCode: s.data().doorCode || "" };
        const cuentas = await Promise.all(TIPOS.map((t) =>
          getDocs(query(collection(db, t.coleccion), where("invitationId", "==", id)))));
        pintar(id, cuentas.map((c) => c.size));
      } catch (e) {
        console.error(e);
        $("msg").textContent = "No se pudo consultar el acceso.";
      }
    }

    function pintar(id, dispositivos) {
      const cont = $("bloques");
      cont.textContent = "";
      TIPOS.forEach((t, i) => cont.appendChild(bloque(id, t, dispositivos[i])));
    }

    function bloque(id, t, dispositivos) {
      const c = document.createElement("div"); c.className = "caja";
      const h = document.createElement("h2"); h.textContent = t.titulo;
      const p = document.createElement("p"); p.textContent = t.texto;
      c.append(h, p);

      const codigo = sec[t.campo];
      const est = document.createElement("p");
      const btn = (texto, clase, fn) => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = texto; if (clase) b.className = clase; b.onclick = fn; return b;
      };

      if (!codigo) {
        est.textContent = "Todavía no tiene código.";
        c.appendChild(est);
        c.appendChild(btn("Generar código", "", async () => {
          try {
            await setDoc(doc(db, "secrets", id),
              { [t.campo]: nuevoCodigo(), updatedAt: serverTimestamp() }, { merge: true });
            elegir();
          } catch (e) { console.error(e); $("msg").textContent = "No se pudo generar el código."; }
        }));
        return c;
      }

      est.textContent = "Código activo. Dispositivos que ya entraron: " + dispositivos + ".";
      const link = t.enlace(id, codigo);
      const inp = document.createElement("input"); inp.readOnly = true; inp.value = link;
      c.append(est, inp,
        btn("Enviar por WhatsApp", "", () =>
          window.open("https://wa.me/?text=" + encodeURIComponent(t.mensaje(link)), "_blank")),
        btn("Copiar enlace", "sec", function () {
          navigator.clipboard.writeText(link).then(() => { this.textContent = "Copiado ✓"; });
        }),
        btn("Cambiar código", "sec", async () => {
          if (!confirm("Los enlaces anteriores van a dejar de funcionar. ¿Cambiar el código?")) return;
          try {
            await setDoc(doc(db, "secrets", id),
              { [t.campo]: nuevoCodigo(), updatedAt: serverTimestamp() }, { merge: true });
            elegir();
            $("msg").textContent = "Código cambiado. Enviá el enlace nuevo.";
          } catch (e) { console.error(e); $("msg").textContent = "No se pudo cambiar el código."; }
        }),
        btn("Quitar este acceso", "rojo", async () => {
          if (!confirm("¿Quitar este acceso? Los enlaces enviados dejan de funcionar.")) return;
          try {
            const g = await getDocs(query(collection(db, t.coleccion), where("invitationId", "==", id)));
            for (const d of g.docs) await deleteDoc(d.ref);
            await updateDoc(doc(db, "secrets", id), { [t.campo]: deleteField() });
            sec[t.campo] = "";
            if (!sec.code && !sec.doorCode) await deleteDoc(doc(db, "secrets", id));
            elegir();
            $("msg").textContent = "Acceso quitado.";
          } catch (e) { console.error(e); $("msg").textContent = "No se pudo quitar el acceso."; }
        })
      );
      return c;
    }
  </script>
</body>
  </html>
