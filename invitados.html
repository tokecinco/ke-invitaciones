<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Invitados - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0 auto;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px}
    h1,h2{color:#c9a24b}
    input,select,textarea,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    textarea{min-height:110px}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    button.sec{background:#1a1a1a}
    button.rojo{background:#c0392b}
    label{font-size:.9rem;display:block;margin-top:8px}
    a{color:#c9a24b}
    .caja{background:#fff;border:1px solid #eadfc8;border-radius:12px;padding:12px;margin:10px 0}
    .caja button{width:auto;padding:8px 12px;margin:4px 4px 0 0;font-size:.9rem}
    .caja.si{border-left:5px solid #4caf50}
    .caja.no{border-left:5px solid #c0392b}
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
    .stat{background:#f6dde2;border-radius:12px;padding:10px;text-align:center;font-size:.8rem}
    .stat b{display:block;font-size:1.3rem;color:#8a6a1f}
    .aviso{background:#f6dde2;border-radius:10px;padding:8px 12px}
    .msg{min-height:1.4em}
  </style>
</head>
<body>
  <h1>Invitados</h1>
  <p><a href="dashboard.html">Menú</a> - <a href="admin.html">Invitaciones</a></p>

  <section id="login">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btn-login" type="button">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <label>Invitación</label>
    <select id="sel"></select>
    <p id="aviso" class="aviso" hidden></p>

    <div id="agregar">
      <h2>Agregar invitados</h2>
      <label>Uno por línea: Nombre; cantidad de lugares</label>
      <textarea id="f-lista" placeholder="Familia Pérez; 4&#10;Juan Gómez; 1&#10;Ana y Luis; 2"></textarea>
      <button id="btn-agregar" type="button">Agregar a la lista</button>
      <p id="msg" class="msg"></p>
    </div>

    <h2>Lista</h2>
    <div class="stats">
      <div class="stat"><b id="s-inv">0</b>Invitados</div>
      <div class="stat"><b id="s-lug">0</b>Lugares</div>
      <div class="stat"><b id="s-resp">0</b>Respondieron</div>
    </div>
    <div id="lista"></div>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, setDoc, deleteDoc, collection, getDocs, query, where, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    let invitaciones = {};
    let personalizado = { basico: false, premium: true };

    $("btn-login").addEventListener("click", async () => {
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
      } catch (e) { $("login-msg").textContent = "Email o contraseña incorrectos."; }
    });
    onAuthStateChanged(auth, (u) => {
      $("login").hidden = !!u;
      $("panel").hidden = !u;
      if (u) iniciar();
    });

    async function iniciar() {
      try {
        const [inv, pq] = await Promise.all([
          getDocs(collection(db, "invitations")),
          getDoc(doc(db, "settings", "packages"))
        ]);
        if (pq.exists()) {
          const g = pq.data();
          if (g.basico) personalizado.basico = !!g.basico.personalized;
          if (g.premium) personalizado.premium = !!g.premium.personalized;
        }
        invitaciones = {};
        inv.forEach((d) => { invitaciones[d.id] = d.data(); });
        $("sel").innerHTML = "";
        Object.keys(invitaciones).forEach((id) => {
          const o = document.createElement("option");
          o.value = id;
          o.textContent = (invitaciones[id].honoree || id) + " - " +
            (invitaciones[id].package === "premium" ? "Premium" : "Básico");
          $("sel").appendChild(o);
        });
        const pedida = new URLSearchParams(location.search).get("i");
        if (pedida && invitaciones[pedida]) $("sel").value = pedida;
        cambio();
      } catch (e) {
        console.error(e);
        $("lista").textContent = "No se pudieron cargar las invitaciones.";
      }
    }

    function permitido(id) {
      const k = invitaciones[id] && invitaciones[id].package === "premium" ? "premium" : "basico";
      return !!personalizado[k];
    }

    function cambio() {
      const id = $("sel").value;
      if (!id) { $("lista").textContent = "No hay invitaciones."; return; }
      const ok = permitido(id);
      $("agregar").hidden = !ok;
      $("aviso").hidden = ok;
      $("aviso").textContent = "El paquete de esta invitación no incluye invitaciones personalizadas. Cambiala a Premium desde Invitaciones, o activá la opción en Paquetes.";
      listar();
    }
    $("sel").addEventListener("change", cambio);

    function nuevoId() {
      const a = new Uint8Array(10);
      crypto.getRandomValues(a);
      return Array.from(a, (b) => (b % 36).toString(36)).join("");
    }
    function linkDe(inv, gid) {
      return location.origin + location.pathname.replace(/invitados\.html$/, "") + "i/" + inv + "/" + gid;
    }

    $("btn-agregar").addEventListener("click", async () => {
      const inv = $("sel").value;
      const lineas = $("f-lista").value.split("\n").map((l) => l.trim()).filter(Boolean);
      if (!inv || !lineas.length) { $("msg").textContent = "Escribí al menos un invitado."; return; }
      $("msg").textContent = "Agregando...";
      let cuantos = 0;
      try {
        for (const l of lineas) {
          const partes = l.split(";");
          const nombre = partes[0].trim().slice(0, 80);
          let lugares = parseInt((partes[1] || "1").trim(), 10);
          if (!nombre) continue;
          if (!(lugares >= 1)) lugares = 1;
          if (lugares > 20) lugares = 20;
          await setDoc(doc(db, "guests", nuevoId()), {
            invitationId: inv, name: nombre, seats: lugares, createdAt: serverTimestamp()
          });
          cuantos++;
        }
        $("f-lista").value = "";
        $("msg").textContent = "Se agregaron " + cuantos + " invitado(s).";
        listar();
      } catch (e) {
        console.error(e);
        $("msg").textContent = "No se pudo agregar (se cargaron " + cuantos + ").";
        listar();
      }
    });

    async function listar() {
      const inv = $("sel").value;
      const cont = $("lista");
      cont.textContent = "Cargando...";
      try {
        const [gs, rs] = await Promise.all([
          getDocs(query(collection(db, "guests"), where("invitationId", "==", inv))),
          getDocs(query(collection(db, "rsvps"), where("invitationId", "==", inv)))
        ]);
        const resp = {};
        rs.docs.map((d) => d.data()).filter((r) => r.guestId)
          .sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0))
          .forEach((r) => { resp[r.guestId] = r; });

        const lista = gs.docs.map((d) => ({ id: d.id, x: d.data() }))
          .sort((a, b) => a.x.name.localeCompare(b.x.name, "es"));

        let lugares = 0, respondieron = 0;
        cont.textContent = "";
        lista.forEach(({ id, x }) => {
          lugares += x.seats || 0;
          const r = resp[id];
          if (r) respondieron++;
          const t = document.createElement("div");
          t.className = "caja" + (r ? (r.attending ? " si" : " no") : "");
          const n = document.createElement("b"); n.textContent = x.name;
          const e = document.createElement("div");
          e.textContent = x.seats + " lugar(es) - " +
            (r ? (r.attending ? "Confirmó " + r.guests + " persona(s)" : "No asiste") : "Sin respuesta");
          t.append(n, e);

          const b = (texto, clase, fn) => {
            const el = document.createElement("button");
            el.type = "button"; el.textContent = texto;
            if (clase) el.className = clase;
            el.onclick = fn; return el;
          };
          const link = linkDe(inv, id);
          const copiar = b("Copiar enlace", "", () =>
            navigator.clipboard.writeText(link).then(() => { copiar.textContent = "Copiado"; }));
          const wa = b("Enviar por WhatsApp", "sec", () => {
            const texto = "Hola " + x.name + "! Te invito a " + (invitaciones[inv].honoree || "mi evento") +
              ". Esta es tu invitación personal: " + link;
            window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank");
          });
          const del = b("Eliminar", "rojo", async () => {
            if (!confirm("¿Eliminar a " + x.name + " de la lista? Su enlace dejará de funcionar.")) return;
            try { await deleteDoc(doc(db, "guests", id)); listar(); }
            catch (err) { console.error(err); $("msg").textContent = "No se pudo eliminar."; }
          });
          t.append(copiar, wa, del);
          cont.appendChild(t);
        });
        if (!lista.length) cont.textContent = "Todavía no hay invitados cargados.";
        $("s-inv").textContent = lista.length;
        $("s-lug").textContent = lugares;
        $("s-resp").textContent = respondieron;
      } catch (e) {
        console.error(e);
        cont.textContent = "No se pudo cargar la lista.";
      }
    }
  </script>
</body>
  </html>
