<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Invitados - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0 auto;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px}
    h1,h2{color:#c9a24b}
    input,select,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    button.sec{background:#1a1a1a}
    button.rojo{background:#c0392b}
    label{font-size:.85rem;display:block;margin-top:8px}
    a{color:#c9a24b}
    .caja{background:#fff;border:1px solid #eadfc8;border-radius:12px;padding:12px;margin:10px 0}
    .caja button{width:auto;padding:8px 12px;margin:4px 4px 0 0;font-size:.9rem}
    .caja.si{border-left:5px solid #4caf50}
    .caja.no{border-left:5px solid #c0392b}
    .fila-dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
    .stat{background:#f6dde2;border-radius:12px;padding:10px;text-align:center;font-size:.8rem}
    .stat b{display:block;font-size:1.3rem;color:#8a6a1f}
    .aviso{background:#f6dde2;border-radius:10px;padding:8px 12px;margin:8px 0}
    .msg{min-height:1.4em}
  </style>
</head>
<body>
  <h1>Invitados</h1>
  <p><a href="dashboard.html">Menú</a> - <a href="admin.html">Invitaciones</a></p>

  <section id="login">
    <input id="email" type="email" placeholder="Email de administrador" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btn-login" type="button">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <p>Sesión: <b id="sesion-email"></b></p>
    <button id="btn-salir" class="sec" type="button">Cerrar sesión</button>
    <p id="admin-aviso" class="aviso" hidden></p>

    <div id="contenido">
      <label>Invitación</label>
      <select id="sel"></select>
      <p id="aviso" class="aviso" hidden></p>

      <div id="agregar">
        <h2>Agregar invitado</h2>
        <form id="form" novalidate>
          <label>Nombre del invitado</label>
          <input id="f-nombre" type="text" placeholder="Ej: Familia Pérez" maxlength="80" autocomplete="off">
          <div class="fila-dos">
            <div>
              <label>Cantidad de lugares</label>
              <input id="f-lugares" type="number" min="1" max="20" value="1" inputmode="numeric">
            </div>
            <div>
              <label>Número de mesa (opcional)</label>
              <input id="f-mesa" type="text" placeholder="Ej: 12" maxlength="30" autocomplete="off">
            </div>
          </div>
          <button id="btn-agregar" type="submit">Agregar invitado</button>
        </form>
        <p id="msg" class="msg"></p>
      </div>

      <h2>Lista</h2>
      <div class="stats">
        <div class="stat"><b id="s-inv">0</b>Invitados</div>
        <div class="stat"><b id="s-lug">0</b>Lugares</div>
        <div class="stat"><b id="s-resp">0</b>Respondieron</div>
      </div>
      <div id="lista"></div>
    </div>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs, query, where, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    const ADMIN_UID = "Ivb1LtWt6Eb8GkanORvC3C0Qx943";
    const ETIQ_PAQ = { basico: "Esencial", premium: "Premium", pase: "Pase QR (ant.)" };
    let invitaciones = {};
    let personalizado = { basico: false };

    $("btn-login").addEventListener("click", async () => {
      $("login-msg").textContent = "Entrando...";
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
        $("login-msg").textContent = "";
      } catch (e) { $("login-msg").textContent = "Email o contraseña incorrectos."; }
    });
    $("btn-salir").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (u) => {
      if (!u || u.isAnonymous) {
        $("login").hidden = false;
        $("panel").hidden = true;
        return;
      }
      $("login").hidden = true;
      $("panel").hidden = false;
      $("sesion-email").textContent = u.email || u.uid;
      if (u.uid !== ADMIN_UID) {
        $("admin-aviso").textContent = "Iniciaste sesión con otra cuenta (" + (u.email || u.uid) + "), no con la cuenta administradora. Tocá \"Cerrar sesión\" y entrá como administrador.";
        $("admin-aviso").hidden = false;
        $("contenido").hidden = true;
        return;
      }
      $("admin-aviso").hidden = true;
      $("contenido").hidden = false;
      iniciar();
    });

    async function iniciar() {
      try {
        const [inv, pq] = await Promise.all([
          getDocs(collection(db, "invitations")),
          getDoc(doc(db, "settings", "packages"))
        ]);
        if (pq.exists() && pq.data().basico) personalizado.basico = !!pq.data().basico.personalized;
        invitaciones = {};
        inv.forEach((d) => { invitaciones[d.id] = d.data(); });
        $("sel").innerHTML = "";
        Object.keys(invitaciones).forEach((id) => {
          const o = document.createElement("option");
          o.value = id;
          o.textContent = (invitaciones[id].honoree || id) + " - " + (ETIQ_PAQ[invitaciones[id].package] || "Esencial");
          $("sel").appendChild(o);
        });
        const pedida = new URLSearchParams(location.search).get("i");
        if (pedida && invitaciones[pedida]) $("sel").value = pedida;
        cambio();
      } catch (e) {
        console.error(e);
        $("lista").textContent = "No se pudieron cargar las invitaciones.";
      }
    }

    function permitido(id) {
      const p = invitaciones[id] && invitaciones[id].package;
      return !!invitaciones[id] && (p === "premium" || p === "pase" || personalizado.basico);
    }

    function cambio() {
      const id = $("sel").value;
      if (!id) { $("lista").textContent = "No hay invitaciones."; return; }
      const ok = permitido(id);
      $("agregar").hidden = !ok;
      $("aviso").hidden = ok;
      $("aviso").textContent = "El paquete Esencial no incluye invitaciones personalizadas con pase QR. Cambiala a Premium desde Invitaciones.";
      listar();
    }
    $("sel").addEventListener("change", cambio);

    function nuevoId() {
      const a = new Uint8Array(10);
      crypto.getRandomValues(a);
      return Array.from(a, (b) => (b % 36).toString(36)).join("");
    }
    function linkDe(inv, gid) {
      return location.origin + location.pathname.replace(/invitados\.html$/, "") + "i/" + inv + "/" + gid;
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const inv = $("sel").value;
      const nombre = $("f-nombre").value.trim();
      let lugares = parseInt($("f-lugares").value, 10);
      if (!inv) return;
      if (!nombre) { $("msg").textContent = "Escribí el nombre del invitado."; $("f-nombre").focus(); return; }
      if (!(lugares >= 1)) lugares = 1;
      if (lugares > 20) { $("msg").textContent = "La cantidad máxima de lugares por invitado es 20."; return; }
      $("btn-agregar").disabled = true;
      $("msg").textContent = "Agregando...";
      try {
        const datos = { invitationId: inv, name: nombre.slice(0, 80), seats: lugares, createdAt: serverTimestamp() };
        const mesa = $("f-mesa").value.trim();
        if (mesa) datos.table = mesa.slice(0, 30);
        await setDoc(doc(db, "guests", nuevoId()), datos);
        $("msg").textContent = "Agregado: " + nombre + ". Podés cargar el siguiente.";
        $("f-nombre").value = "";
        $("f-mesa").value = "";
        $("f-lugares").value = "1";
        $("f-nombre").focus();
        listar();
      } catch (err) {
        console.error(err);
        $("msg").textContent = "No se pudo agregar. Intentá de nuevo.";
      }
      $("btn-agregar").disabled = false;
    });

    function campo(etiqueta, el) {
      const c = document.createElement("div");
      const l = document.createElement("label"); l.textContent = etiqueta;
      c.append(l, el);
      return c;
    }

    async function listar() {
      const inv = $("sel").value;
      const cont = $("lista");
      cont.textContent = "Cargando...";
      try {
        const [gs, rs] = await Promise.all([
          getDocs(query(collection(db, "guests"), where("invitationId", "==", inv))),
          getDocs(query(collection(db, "rsvps"), where("invitationId", "==", inv)))
        ]);
        const resp = {};
        rs.docs.map((d) => d.data()).filter((r) => r.guestId)
          .sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0))
          .forEach((r) => { resp[r.guestId] = r; });

        const lista = gs.docs.map((d) => ({ id: d.id, x: d.data() }))
          .sort((a, b) => a.x.name.localeCompare(b.x.name, "es"));

        let lugares = 0, respondieron = 0;
        cont.textContent = "";
        lista.forEach(({ id, x }) => {
          lugares += x.seats || 0;
          const r = resp[id];
          if (r) respondieron++;
          const t = document.createElement("div");
          t.className = "caja" + (r ? (r.attending ? " si" : " no") : "");
          const n = document.createElement("b"); n.textContent = x.name;
          const e = document.createElement("div");
          e.textContent = x.seats + (x.seats === 1 ? " lugar" : " lugares") + " - " +
            (x.table ? "mesa " + x.table : "sin mesa") + " - " +
            (r ? (r.attending ? "Confirmó " + r.guests + " persona(s)" : "No asiste") : "Sin respuesta") +
            (x.checkedIn ? " - Ya ingresó" : "");
          t.append(n, e);

          const lug = document.createElement("input");
          lug.type = "number"; lug.min = "1"; lug.max = "20"; lug.inputMode = "numeric"; lug.value = String(x.seats || 1);
          const mesa = document.createElement("input");
          mesa.type = "text"; mesa.maxLength = 30; mesa.placeholder = "Ej: 12"; mesa.value = x.table || "";
          const edit = document.createElement("div"); edit.className = "fila-dos";
          edit.append(campo("Lugares", lug), campo("Mesa", mesa));
          t.appendChild(edit);

          const b = (texto, clase, fn) => {
            const el = document.createElement("button");
            el.type = "button"; el.textContent = texto;
            if (clase) el.className = clase;
            el.onclick = fn; return el;
          };
          const guardar = b("Guardar cambios", "sec", async () => {
            const cant = parseInt(lug.value, 10);
            if (!(cant >= 1 && cant <= 20)) { $("msg").textContent = "Los lugares tienen que ser entre 1 y 20."; return; }
            try {
              await updateDoc(doc(db, "guests", id), { seats: cant, table: mesa.value.trim() });
              $("msg").textContent = "Cambios guardados para " + x.name + ".";
              listar();
            } catch (err) { console.error(err); $("msg").textContent = "No se pudo guardar."; }
          });
          const link = linkDe(inv, id);
          const copiar = b("Copiar enlace", "", () =>
            navigator.clipboard.writeText(link).then(() => { copiar.textContent = "Copiado"; }));
          const wa = b("Enviar por WhatsApp", "sec", () => {
            const texto = "Hola " + x.name + "! Te invito a " + (invitaciones[inv].honoree || "mi evento") +
              ". Esta es tu invitación personal: " + link;
            window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank");
          });
          const del = b("Eliminar", "rojo", async () => {
            if (!confirm("¿Eliminar a " + x.name + " de la lista? Su enlace dejará de funcionar.")) return;
            try { await deleteDoc(doc(db, "guests", id)); listar(); }
            catch (err) { console.error(err); $("msg").textContent = "No se pudo eliminar."; }
          });
          t.append(guardar, copiar, wa, del);
          cont.appendChild(t);
        });
        if (!lista.length) cont.textContent = "Todavía no hay invitados cargados.";
        $("s-inv").textContent = lista.length;
        $("s-lug").textContent = lugares;
        $("s-resp").textContent = respondieron;
      } catch (e) {
        console.error(e);
        cont.textContent = "No se pudo cargar la lista.";
      }
    }
  </script>
</body>
  </html>
