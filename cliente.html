<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mi panel - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0 auto;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px}
    h1,h2{color:#c9a24b}
    input,textarea,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    textarea{min-height:110px}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    button.sec{background:#1a1a1a}
    button.rojo{background:#c0392b}
    a{color:#c9a24b}
    label.etq{display:block;font-size:.85rem;margin-top:6px}
    .caja{background:#fff;border:1px solid #eadfc8;border-radius:12px;padding:12px;margin:12px 0}
    .caja button{width:auto;padding:8px 12px;margin:4px 4px 0 0;font-size:.9rem}
    .panelx{border-top:1px dashed #d8cbb0;margin-top:10px;padding-top:6px}
    .panelx form button{width:100%;padding:12px;font-size:1rem}
    .fila-dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}
    .stat{background:#f6dde2;border-radius:10px;padding:8px;text-align:center;font-size:.8rem}
    .stat b{display:block;font-size:1.3rem;color:#8a6a1f}
    .resp{border-left:5px solid #4caf50;padding:6px 10px;margin:6px 0;background:#fffdf8}
    .resp.no{border-left-color:#c0392b}
    .msj{border-left:5px solid #e0a800;padding:6px 10px;margin:6px 0;background:#fffdf8}
    .msj.ok{border-left-color:#2e9e57}
    .msj p{margin:4px 0;white-space:pre-wrap}
    .inv{border:1px solid #eadfc8;border-left:5px solid #ccc;border-radius:10px;padding:8px 10px;margin:8px 0;background:#fffdf8}
    .inv.si{border-left-color:#4caf50}
    .inv.no{border-left-color:#c0392b}
    .fc-foto{display:flex;gap:10px;align-items:flex-start;border:1px solid #eadfc8;border-radius:10px;padding:8px;margin:8px 0;background:#fffdf8}
    .fc-foto img{width:68px;height:68px;object-fit:cover;border-radius:6px;flex:0 0 auto;background:#eee}
    .fc-foto-info{flex:1;min-width:0}
    .fc-foto-info p{margin:3px 0;font-size:.9rem;font-style:italic;overflow-wrap:anywhere}
    .vista{width:100%;border:1px solid #eadfc8;border-radius:8px;margin:8px 0}
    .boton-link{display:inline-block;background:#c9a24b;color:#fff;text-decoration:none;border-radius:10px;padding:8px 12px;margin:4px 4px 0 0;font-size:.9rem}
    .msg{min-height:1.4em}
  </style>
</head>
<body>
  <h1>Mi panel</h1>

  <section id="acceso">
    <p>Entrá con tu cuenta. Si recibiste un enlace por WhatsApp, abrilo directamente: no necesitás cuenta.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="current-password">
    <button id="btn-entrar" type="button">Entrar</button>
    <button id="btn-crear" class="sec" type="button">Crear cuenta nueva</button>
    <p id="acc-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <p id="modo"></p>
    <button id="btn-salir" class="sec" type="button">Salir</button>
    <h2>Mi invitación</h2>
    <div id="lista"></div>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, createUserWithEmailAndPassword, signInAnonymously, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs, query, where, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    const $$ = (n) => "$" + Number(n || 0).toLocaleString("es-AR");
    const ETIQ = { pendiente: "Pendiente", senado: "Señado", pagado: "Pagado" };
    const ETIQ_PAQ = { basico: "Básico", premium: "Premium", pase: "Pase QR" };
    const params = new URLSearchParams(location.search);
    const idCod = params.get("i");
    const codigo = params.get("c");

    function h(tag, texto, clase) {
      const e = document.createElement(tag);
      if (texto) e.textContent = texto;
      if (clase) e.className = clase;
      return e;
    }
    const base = () => location.origin + location.pathname.replace(/[^/]*$/, "");
    const linkDe = (id) => base() + "i/" + id;
    const hora = (ts) => ts && ts.toDate
      ? ts.toDate().toLocaleDateString("es-AR", { day: "numeric", month: "short" }) + " " +
        ts.toDate().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }) : "";
    const limpiarTag = (t) => String(t || "").replace(/^#+/, "").replace(/[^\p{L}\p{N}_]/gu, "").slice(0, 40);

    function errorAuth(e) {
      const c = (e && e.code) || "";
      if (c.includes("email-already-in-use")) return "Ese email ya tiene una cuenta. Probá con Entrar.";
      if (c.includes("weak-password")) return "La contraseña es muy corta (mínimo 6 caracteres).";
      if (c.includes("invalid-email")) return "El email no es válido.";
      if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found"))
        return "Email o contraseña incorrectos.";
      return "No se pudo completar. Intentá de nuevo.";
    }

    $("btn-entrar").addEventListener("click", async () => {
      $("acc-msg").textContent = "Entrando...";
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
        $("acc-msg").textContent = "";
      } catch (e) { $("acc-msg").textContent = errorAuth(e); }
    });
    $("btn-crear").addEventListener("click", async () => {
      $("acc-msg").textContent = "Creando cuenta...";
      try {
        const email = $("email").value.trim();
        const r = await createUserWithEmailAndPassword(auth, email, $("clave").value);
        await setDoc(doc(db, "users", r.user.uid), { email: email, createdAt: serverTimestamp() });
        $("acc-msg").textContent = "";
      } catch (e) { $("acc-msg").textContent = errorAuth(e); }
    });
    $("btn-salir").addEventListener("click", () => {
      signOut(auth).then(() => { location.href = location.pathname; });
    });

    onAuthStateChanged(auth, async (u) => {
      if (!u) {
        if (idCod && codigo) {
          $("acceso").hidden = true;
          $("panel").hidden = false;
          $("modo").textContent = "Entrando con tu código...";
          try { await signInAnonymously(auth); }
          catch (e) {
            console.error(e);
            $("modo").textContent = "No se pudo iniciar el acceso por código. Avisale al administrador.";
          }
          return;
        }
        $("acceso").hidden = false;
        $("panel").hidden = true;
        return;
      }
      $("acceso").hidden = true;
      $("panel").hidden = false;
      if (u.isAnonymous) await modoCodigo(u); else await modoCuenta(u);
    });

    /* Con cuenta */
    async function modoCuenta(u) {
      $("modo").textContent = "Sesión: " + u.email;
      const cont = $("lista");
      cont.textContent = "Cargando...";
      try {
        const [inv, pag] = await Promise.all([
          getDocs(query(collection(db, "invitations"), where("ownerId", "==", u.uid))),
          getDocs(query(collection(db, "payments"), where("ownerId", "==", u.uid)))
        ]);
        const pagos = {};
        pag.forEach((d) => { pagos[d.id] = d.data(); });
        cont.textContent = "";
        if (inv.empty) {
          cont.textContent = "Todavía no tenés invitaciones vinculadas a tu cuenta. Si ya contrataste una, avisanos para vincularla.";
          return;
        }
        inv.forEach((d) => cont.appendChild(tarjeta(d.id, d.data(), pagos[d.id])));
      } catch (e) {
        console.error(e);
        cont.textContent = "No se pudieron cargar tus invitaciones.";
      }
    }

    /* Con código */
    async function modoCodigo(u) {
      $("modo").textContent = "Acceso por código";
      const cont = $("lista");
      if (!idCod) {
        cont.textContent = "Abrí el enlace que te enviamos por WhatsApp para entrar a tu panel.";
        return;
      }
      cont.textContent = "Cargando...";
      if (codigo) {
        try {
          await setDoc(doc(db, "grants", u.uid + "_" + idCod), {
            invitationId: idCod, code: codigo, uid: u.uid, createdAt: serverTimestamp()
          });
        } catch (e) {
          console.error(e);
          cont.textContent = "El código no es válido o ya no está vigente. Pedile un enlace nuevo al administrador.";
          return;
        }
      }
      try {
        const s = await getDoc(doc(db, "invitations", idCod));
        if (!s.exists()) { cont.textContent = "No se encontró la invitación."; return; }
        let p = null;
        try {
          const ps = await getDoc(doc(db, "payments", idCod));
          if (ps.exists()) p = ps.data();
        } catch (e) { console.error(e); }
        cont.textContent = "";
        cont.appendChild(tarjeta(idCod, s.data(), p));
      } catch (e) {
        console.error(e);
        cont.textContent = "No se pudo abrir el panel. Pedile un enlace nuevo al administrador.";
      }
    }

    /* Tarjeta de la invitación */
    function tarjeta(id, x, p) {
      const esPase = x.package === "pase";
      const t = h("div", "", "caja");
      t.appendChild(h("b", x.honoree || id));
      t.appendChild(h("div", (x.active ? "Publicada" : "No publicada") + " - " + (x.date || "") +
        " - Paquete " + (ETIQ_PAQ[x.package] || "Básico")));
      const a = h("a", linkDe(id));
      a.href = linkDe(id); a.target = "_blank"; a.style.wordBreak = "break-all";
      t.appendChild(a);
      t.appendChild(h("p", p
        ? "Pago: " + (ETIQ[p.status] || p.status) + " - Cobrado " + $$(p.received) + " de " + $$(p.price) +
          " - Saldo " + $$(Math.max((p.price || 0) - (p.received || 0), 0))
        : "Pago: todavía sin registrar"));

      const bCopiar = h("button", "Copiar enlace");
      bCopiar.onclick = () => navigator.clipboard.writeText(linkDe(id)).then(() => { bCopiar.textContent = "Copiado ✓"; });
      const bInv = h("button", "Invitados y pases", "sec");
      const bConf = h("button", "Confirmaciones", "sec");
      const bFoto = h("button", "Fotocabina virtual", "sec");
      const bHash = h("button", "Hashtag de las fotos", "sec");
      const bLibro = h("button", "Libro de mensajes", "sec");
      t.append(bCopiar, bInv, bConf);
      if (!esPase) t.append(bFoto, bHash, bLibro);

      const pInv = h("div", "", "panelx"); pInv.hidden = true;
      const pConf = h("div", "", "panelx"); pConf.hidden = true;
      const pFoto = h("div", "", "panelx"); pFoto.hidden = true;
      const pHash = h("div", "", "panelx"); pHash.hidden = true;
      const pLibro = h("div", "", "panelx"); pLibro.hidden = true;
      t.append(pInv, pConf);
      if (!esPase) t.append(pFoto, pHash, pLibro);

      invitados(id, x, bInv, pInv);
      confirmaciones(id, bConf, pConf);
      if (!esPase) {
        fotocabina(id, x, bFoto, pFoto);
        hashtag(id, x, bHash, pHash);
        libro(id, x, bLibro, pLibro);
      }
      return t;
    }

    /* Lista de invitados */
    function nuevoId() {
      const a = new Uint8Array(10);
      crypto.getRandomValues(a);
      return Array.from(a, (b) => (b % 36).toString(36)).join("");
    }

    function campo(etiqueta, el) {
      const c = document.createElement("div");
      c.append(h("label", etiqueta, "etq"), el);
      return c;
    }

    function invitados(id, x, boton, panel) {
      if (x.package !== "premium" && x.package !== "pase") {
        panel.appendChild(h("p", "La lista de invitados con invitaciones personales y pases está disponible en los paquetes Premium y Pase QR."));
        boton.onclick = () => { panel.hidden = !panel.hidden; };
        return;
      }

      panel.appendChild(h("p", "Cargá cada invitado con su nombre, la cantidad de lugares y, si querés, el número de mesa. Después enviá a cada uno su invitación con su pase por WhatsApp."));

      const form = document.createElement("form");
      form.noValidate = true;

      const nombre = document.createElement("input");
      nombre.type = "text"; nombre.placeholder = "Ej: Familia Pérez"; nombre.maxLength = 80;
      nombre.autocomplete = "off";

      const lugares = document.createElement("input");
      lugares.type = "number"; lugares.min = "1"; lugares.max = "20";
      lugares.value = "1"; lugares.inputMode = "numeric";

      const mesaNueva = document.createElement("input");
      mesaNueva.type = "text"; mesaNueva.placeholder = "Ej: 12"; mesaNueva.maxLength = 30;
      mesaNueva.autocomplete = "off";

      const dos = h("div", "", "fila-dos");
      dos.append(campo("Cantidad de lugares", lugares), campo("Número de mesa (opcional)", mesaNueva));

      const agregar = h("button", "Agregar invitado");
      agregar.type = "submit";

      form.append(campo("Nombre del invitado", nombre), dos, agregar);

      const msg = h("p", "", "msg");
      const stats = h("div", "", "stats");
      const lista = h("div");
      panel.append(form, msg, stats, lista);

      let cargado = false;

      async function listar() {
        lista.textContent = "Cargando...";
        try {
          const [gs, rs] = await Promise.all([
            getDocs(query(collection(db, "guests"), where("invitationId", "==", id))),
            getDocs(query(collection(db, "rsvps"), where("invitationId", "==", id)))
          ]);
          const resp = {};
          rs.docs.map((d) => d.data()).filter((r) => r.guestId)
            .sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0))
            .forEach((r) => { resp[r.guestId] = r; });
          const gentes = gs.docs.map((d) => ({ id: d.id, g: d.data() }))
            .sort((a, b) => a.g.name.localeCompare(b.g.name, "es"));

          let total = 0, respondieron = 0;
          lista.textContent = "";
          gentes.forEach(({ id: gid, g }) => {
            total += g.seats || 0;
            const r = resp[gid];
            if (r) respondieron++;
            const c = h("div", "", "inv" + (r ? (r.attending ? " si" : " no") : ""));
            c.appendChild(h("b", g.name));
            c.appendChild(h("div",
              g.seats + (g.seats === 1 ? " lugar" : " lugares") + " - " +
              (g.table ? "mesa " + g.table : "sin mesa") + " - " +
              (r ? (r.attending ? "Confirmó " + r.guests + " persona(s)" : "No asiste") : "Sin respuesta") +
              (g.checkedIn ? " - Ya ingresó" : "")));

            const lug = document.createElement("input");
            lug.type = "number"; lug.min = "1"; lug.max = "20"; lug.inputMode = "numeric"; lug.value = String(g.seats || 1);
            const mesa = document.createElement("input");
            mesa.type = "text"; mesa.maxLength = 30; mesa.placeholder = "Ej: 12"; mesa.value = g.table || "";
            const edit = h("div", "", "fila-dos");
            edit.append(campo("Lugares", lug), campo("Mesa", mesa));
            c.appendChild(edit);

            const guardar = h("button", "Guardar cambios", "sec");
            guardar.onclick = async () => {
              const n = parseInt(lug.value, 10);
              if (!(n >= 1 && n <= 20)) { msg.textContent = "Los lugares tienen que ser entre 1 y 20."; return; }
              try {
                await updateDoc(doc(db, "guests", gid), { name: g.name, seats: n, table: mesa.value.trim() });
                msg.textContent = "Cambios guardados para " + g.name + ".";
                listar();
              } catch (e) { console.error(e); msg.textContent = "No se pudo guardar."; }
            };

            const link = base() + "i/" + id + "/" + gid;
            const wa = h("button", "Enviar por WhatsApp");
            wa.onclick = () => {
              const t = "Hola " + g.name + "! Te invito a " + (x.honoree || "mi evento") +
                ". Esta es tu invitación personal con tu pase de acceso: " + link;
              window.open("https://wa.me/?text=" + encodeURIComponent(t), "_blank");
            };
            const cop = h("button", "Copiar enlace", "sec");
            cop.onclick = () => navigator.clipboard.writeText(link).then(() => { cop.textContent = "Copiado ✓"; });
            const del = h("button", "Eliminar", "rojo");
            del.onclick = async () => {
              if (!confirm("¿Eliminar a " + g.name + " de la lista? Su enlace dejará de funcionar.")) return;
              try { await deleteDoc(doc(db, "guests", gid)); listar(); }
              catch (e) { console.error(e); msg.textContent = "No se pudo eliminar."; }
            };
            c.append(guardar, wa, cop, del);
            lista.appendChild(c);
          });
          if (!gentes.length) lista.textContent = "Todavía no cargaste invitados.";

          stats.textContent = "";
          [[gentes.length, "Invitados"], [total, "Lugares"], [respondieron, "Respondieron"]].forEach(([v, t]) => {
            const s = h("div", "", "stat"); s.appendChild(h("b", String(v))); s.append(t); stats.appendChild(s);
          });
        } catch (e) {
          console.error(e);
          lista.textContent = "No se pudo cargar la lista.";
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const n = nombre.value.trim();
        let cant = parseInt(lugares.value, 10);
        if (!n) { msg.textContent = "Escribí el nombre del invitado."; nombre.focus(); return; }
        if (!(cant >= 1)) cant = 1;
        if (cant > 20) { msg.textContent = "La cantidad máxima de lugares por invitado es 20."; return; }
        agregar.disabled = true;
        msg.textContent = "Agregando...";
        try {
          const datos = { invitationId: id, name: n.slice(0, 80), seats: cant, createdAt: serverTimestamp() };
          const m = mesaNueva.value.trim();
          if (m) datos.table = m.slice(0, 30);
          await setDoc(doc(db, "guests", nuevoId()), datos);
          msg.textContent = "Agregado: " + n + ". Podés cargar el siguiente.";
          nombre.value = "";
          mesaNueva.value = "";
          lugares.value = "1";
          nombre.focus();
          listar();
        } catch (err) {
          console.error(err);
          msg.textContent = "No se pudo agregar. Intentá de nuevo.";
        }
        agregar.disabled = false;
      });

      boton.onclick = () => {
        panel.hidden = !panel.hidden;
        if (!panel.hidden && !cargado) { cargado = true; listar(); }
      };
    }

    function confirmaciones(id, boton, panel) {
      let cargadas = false;
      boton.onclick = async () => {
        panel.hidden = !panel.hidden;
        if (panel.hidden || cargadas) return;
        panel.textContent = "Cargando...";
        try {
          const s = await getDocs(query(collection(db, "rsvps"), where("invitationId", "==", id)));
          const lista = s.docs.map((r) => r.data())
            .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
          let conf = 0, pers = 0, no = 0;
          const cuerpo = h("div");
          lista.forEach((r) => {
            if (r.attending) { conf++; pers += r.guests || 0; } else no++;
            const f = h("div", "", "resp" + (r.attending ? "" : " no"));
            f.appendChild(h("b", r.name));
            f.appendChild(h("div", r.attending ? "Asiste - " + r.guests + " persona(s)" : "No asiste"));
            if (r.message) f.appendChild(h("i", "“" + r.message + "”"));
            cuerpo.appendChild(f);
          });
          const stats = h("div", "", "stats");
          [[conf, "Confirmaron"], [pers, "Personas"], [no, "No asisten"]].forEach(([v, l]) => {
            const c = h("div", "", "stat"); c.appendChild(h("b", String(v))); c.append(l); stats.appendChild(c);
          });
          panel.textContent = "";
          panel.appendChild(stats);
          if (!lista.length) panel.appendChild(h("p", "Todavía no hay respuestas."));
          panel.appendChild(cuerpo);
          cargadas = true;
        } catch (e) {
          console.error(e);
          panel.textContent = "No se pudieron cargar las confirmaciones.";
        }
      };
    }

    function interruptor(id, x, campoNombre, nombre, panel, defecto = false) {
      const estado = h("p");
      const b = h("button", "Abrir");
      const pintar = () => {
        const on = defecto ? x[campoNombre] !== false : x[campoNombre] === true;
        estado.textContent = nombre + ": " + (on ? "abierta" : "cerrada");
        b.textContent = on ? "Cerrar" : "Abrir";
      };
      b.onclick = async () => {
        const actual = defecto ? x[campoNombre] !== false : x[campoNombre] === true;
        const nuevo = !actual;
        try {
          await updateDoc(doc(db, "invitations", id), { [campoNombre]: nuevo });
          x[campoNombre] = nuevo;
          pintar();
        } catch (e) { console.error(e); estado.textContent = "No se pudo cambiar el estado."; }
      };
      pintar();
      panel.append(estado, b);
    }

    function libro(id, x, boton, panel) {
      interruptor(id, x, "guestbookOpen", "Libro de mensajes", panel, false);
      const lista = h("div");
      panel.appendChild(lista);
      let cargado = false;

      async function mensajes() {
        lista.textContent = "Cargando...";
        try {
          const s = await getDocs(query(collection(db, "wishes"), where("invitationId", "==", id)));
          const ms = s.docs.map((d) => ({ id: d.id, m: d.data() }))
            .sort((a, b) => (b.m.createdAt?.seconds || 0) - (a.m.createdAt?.seconds || 0));
          lista.textContent = "";
          if (!ms.length) { lista.textContent = "Todavía no hay mensajes."; return; }
          ms.forEach(({ id: mid, m }) => {
            const c = h("div", "", "msj" + (m.approved ? " ok" : ""));
            c.appendChild(h("b", m.name));
            c.appendChild(h("p", m.message));
            c.appendChild(h("small", (m.approved ? "Publicado" : "Pendiente") + " - " + hora(m.createdAt)));
            c.appendChild(document.createElement("br"));
            const ap = h("button", m.approved ? "Ocultar" : "Aprobar", m.approved ? "sec" : "");
            ap.onclick = async () => {
              try { await updateDoc(doc(db, "wishes", mid), { approved: !m.approved }); mensajes(); }
              catch (e) { console.error(e); }
            };
            const del = h("button", "Eliminar", "rojo");
            del.onclick = async () => {
              if (!confirm("¿Eliminar este mensaje? No se puede deshacer.")) return;
              try { await deleteDoc(doc(db, "wishes", mid)); mensajes(); }
              catch (e) { console.error(e); }
            };
            c.append(ap, del);
            lista.appendChild(c);
          });
        } catch (e) { console.error(e); lista.textContent = "No se pudieron cargar los mensajes."; }
      }

      boton.onclick = () => {
        panel.hidden = !panel.hidden;
        if (!panel.hidden && !cargado) { cargado = true; mensajes(); }
      };
    }

    function cargarScript(src) {
      return new Promise((ok, mal) => {
        const s = document.createElement("script");
        s.src = src; s.onload = ok; s.onerror = () => mal(new Error("script"));
        document.head.appendChild(s);
      });
    }

    /* Fotocabina Virtual: código QR para mesa + moderación de fotos */
    async function generarQrSolo(url) {
      if (!window.qrcode) await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js");
      const qr = window.qrcode(0, "M");
      qr.addData(url);
      qr.make();
      const n = qr.getModuleCount();
      const celda = 14, margen = 4;
      const lado = (n + margen * 2) * celda;
      const c = document.createElement("canvas");
      c.width = lado; c.height = lado;
      const g = c.getContext("2d");
      g.fillStyle = "#ffffff"; g.fillRect(0, 0, lado, lado);
      g.fillStyle = "#000000";
      for (let f = 0; f < n; f++) {
        for (let k = 0; k < n; k++) {
          if (qr.isDark(f, k)) g.fillRect((k + margen) * celda, (f + margen) * celda, celda, celda);
        }
      }
      return c.toDataURL("image/png");
    }

    async function generarTarjetaFotocabina(url, x) {
      if (!window.qrcode) await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js");
      const qr = window.qrcode(0, "M");
      qr.addData(url);
      qr.make();
      const n = qr.getModuleCount();

      const W = 1200, H = 1600;
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const g = c.getContext("2d");
      g.fillStyle = "#fffaf3"; g.fillRect(0, 0, W, H);
      g.strokeStyle = "#c9a24b";
      g.lineWidth = 3; g.strokeRect(40, 40, W - 80, H - 80);
      g.lineWidth = 1; g.strokeRect(62, 62, W - 124, H - 124);
      g.textAlign = "center";

      const texto = (t, y, fuente, tam, ancho, color) => {
        let s = tam;
        do {
          g.font = fuente.replace("%", s + "px");
          if (g.measureText(t).width <= ancho) break;
          s -= 4;
        } while (s > 26);
        g.fillStyle = color;
        g.fillText(t, W / 2, y);
      };

      texto("Fotocabina Virtual", 230, "italic % Georgia, serif", 108, 960, "#3a3a3a");

      g.strokeStyle = "#c9a24b"; g.lineWidth = 2;
      g.beginPath();
      g.moveTo(W / 2 - 170, 290); g.lineTo(W / 2 - 22, 290);
      g.moveTo(W / 2 + 22, 290); g.lineTo(W / 2 + 170, 290);
      g.stroke();
      g.fillStyle = "#c9a24b";
      g.beginPath();
      g.moveTo(W / 2, 277); g.lineTo(W / 2 + 12, 290); g.lineTo(W / 2, 303); g.lineTo(W / 2 - 12, 290);
      g.closePath(); g.fill();

      texto("Escaneá el código con tu celular", 390, "% Georgia, serif", 48, 960, "#555555");
      texto("y subí tu foto Polaroid con un mensaje", 450, "% Georgia, serif", 44, 960, "#555555");
      texto("al muro del evento", 510, "italic % Georgia, serif", 46, 960, "#b8892b");

      const margen = 2;
      const celda = Math.floor(620 / (n + margen * 2));
      const lado = celda * (n + margen * 2);
      const qx = Math.round((W - lado) / 2), qy = 610;
      g.fillStyle = "#ffffff";
      g.fillRect(qx - 32, qy - 32, lado + 64, lado + 64);
      g.strokeStyle = "#c9a24b"; g.lineWidth = 2;
      g.strokeRect(qx - 32, qy - 32, lado + 64, lado + 64);
      g.fillStyle = "#000000";
      for (let f = 0; f < n; f++) {
        for (let k = 0; k < n; k++) {
          if (qr.isDark(f, k)) g.fillRect(qx + (k + margen) * celda, qy + (f + margen) * celda, celda, celda);
        }
      }

      texto("1 foto por invitado", 1365, "% Georgia, serif", 38, 960, "#777777");
      const evento = [x.honoree, x.eventType].filter(Boolean).join(" - ");
      if (evento) texto(evento, 1460, "italic % Georgia, serif", 42, 960, "#b8892b");
      return c.toDataURL("image/png");
    }

    function fotocabina(id, x, boton, panel) {
      const url = base() + "fotocabina.html?i=" + encodeURIComponent(id);
      panel.appendChild(h("p", "Los invitados escanean el código QR en su mesa, sacan o eligen 1 foto estilo Polaroid y dejan un breve mensaje en el muro."));
      interruptor(id, x, "photoboothOpen", "Fotocabina virtual", panel, true);

      const acc = h("div");
      const bTarj = h("button", "Generar tarjeta con QR para las mesas");
      const bQr = h("button", "Descargar solo el QR (PNG)", "sec");
      const bCop = h("button", "Copiar enlace", "sec");
      bCop.onclick = () => navigator.clipboard.writeText(url).then(() => { bCop.textContent = "Copiado ✓"; });
      const bVer = h("a", "Abrir muro", "boton-link");
      bVer.href = url; bVer.target = "_blank"; bVer.rel = "noopener";
      acc.append(bTarj, bQr, bCop, bVer);

      const salida = h("div");
      bTarj.onclick = async () => {
        salida.textContent = "Generando tarjeta...";
        try {
          const png = await generarTarjetaFotocabina(url, x);
          salida.textContent = "";
          salida.appendChild(h("p", "Tarjeta lista para imprimir y apoyar en las mesas (formato 3:4, por ejemplo 15 × 20 cm)."));
          const im = document.createElement("img");
          im.className = "vista"; im.src = png; im.alt = "Tarjeta QR de la fotocabina";
          salida.appendChild(im);
          const d = h("a", "Descargar tarjeta (PNG)", "boton-link");
          d.href = png; d.download = "tarjeta-fotocabina-" + id + ".png";
          const p = h("button", "Imprimir", "sec");
          p.onclick = () => {
            const w = window.open("", "_blank");
            if (!w) { alert("El navegador bloqueó la ventana. Descargá la tarjeta e imprimila desde tu galería."); return; }
            w.document.write("<!DOCTYPE html><html><head><meta charset='utf-8'><title>Tarjeta Fotocabina</title>" +
              "<style>@page{margin:0}body{margin:0}img{width:100%;display:block}</style></head><body><img src='" + png + "'></body></html>");
            w.document.close();
            setTimeout(() => w.print(), 500);
          };
          salida.append(d, p);
        } catch (e) {
          console.error(e);
          salida.textContent = "No se pudo generar la tarjeta. Revisá tu conexión e intentá de nuevo.";
        }
      };

      bQr.onclick = async () => {
        try {
          const png = await generarQrSolo(url);
          const d = document.createElement("a");
          d.href = png; d.download = "qr-fotocabina-" + id + ".png";
          d.click();
        } catch (e) { console.error(e); alert("No se pudo generar el QR."); }
      };

      const lista = h("div");
      panel.append(acc, salida, h("h2", "Fotos subidas"), lista);

      let cargado = false;
      async function cargarFotos() {
        lista.textContent = "Cargando...";
        try {
          const s = await getDocs(query(collection(db, "photobooth"), where("invitationId", "==", id)));
          const items = s.docs.map((d) => ({ pid: d.id, f: d.data() }))
            .sort((a, b) => (b.f.createdAt?.seconds || 0) - (a.f.createdAt?.seconds || 0));
          lista.textContent = "";
          if (!items.length) { lista.textContent = "Todavía no hay fotos subidas."; return; }
          items.forEach(({ pid, f }) => {
            const row = h("div", "", "fc-foto");
            const im = document.createElement("img"); im.src = f.photo; im.alt = f.name;
            const info = h("div", "", "fc-foto-info");
            info.appendChild(h("b", f.name));
            if (f.message) info.appendChild(h("p", "“" + f.message + "”"));
            const desc = h("a", "Descargar", "boton-link");
            desc.href = f.photo; desc.download = "polaroid-" + pid + ".webp";
            const del = h("button", "Eliminar", "rojo");
            del.onclick = async () => {
              if (!confirm("¿Eliminar la foto de " + f.name + "?")) return;
              try { await deleteDoc(doc(db, "photobooth", pid)); cargarFotos(); }
              catch (e) { console.error(e); }
            };
            info.append(desc, del);
            row.append(im, info);
            lista.appendChild(row);
          });
        } catch (e) {
          console.error(e);
          lista.textContent = "No se pudieron cargar las fotos.";
        }
      }

      boton.onclick = () => {
        panel.hidden = !panel.hidden;
        if (!panel.hidden && !cargado) { cargado = true; cargarFotos(); }
      };
    }

    /* Hashtag de las fotos y tarjeta con QR para las mesas */
    async function generarTarjeta(tag, x) {
      if (!window.qrcode) await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js");
      const url = "https://www.instagram.com/explore/tags/" + encodeURIComponent(tag) + "/";
      const qr = window.qrcode(0, "M");
      qr.addData(url);
      qr.make();
      const n = qr.getModuleCount();

      const W = 1200, H = 1600;
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const g = c.getContext("2d");
      g.fillStyle = "#fffaf3";
      g.fillRect(0, 0, W, H);
      g.strokeStyle = "#c9a24b";
      g.lineWidth = 3; g.strokeRect(40, 40, W - 80, H - 80);
      g.lineWidth = 1; g.strokeRect(62, 62, W - 124, H - 124);
      g.textAlign = "center";

      const texto = (t, y, fuente, tam, ancho, color) => {
        let s = tam;
        do {
          g.font = fuente.replace("%", s + "px");
          if (g.measureText(t).width <= ancho) break;
          s -= 4;
        } while (s > 28);
        g.fillStyle = color;
        g.fillText(t, W / 2, y);
      };

      texto("Un recuerdo con vos", 230, "italic % Georgia, serif", 110, 960, "#3a3a3a");

      g.strokeStyle = "#c9a24b"; g.lineWidth = 2;
      g.beginPath();
      g.moveTo(W / 2 - 170, 290); g.lineTo(W / 2 - 22, 290);
      g.moveTo(W / 2 + 22, 290); g.lineTo(W / 2 + 170, 290);
      g.stroke();
      g.fillStyle = "#c9a24b";
      g.beginPath();
      g.moveTo(W / 2, 277); g.lineTo(W / 2 + 12, 290); g.lineTo(W / 2, 303); g.lineTo(W / 2 - 12, 290);
      g.closePath(); g.fill();

      texto("Compartí tus fotos y videos", 385, "% Georgia, serif", 46, 960, "#555555");
      texto("del evento con el hashtag", 442, "% Georgia, serif", 46, 960, "#555555");
      texto("#" + tag, 590, "bold % Georgia, serif", 140, 960, "#b8892b");

      const margen = 2;
      const celda = Math.floor(600 / (n + margen * 2));
      const lado = celda * (n + margen * 2);
      const qx = Math.round((W - lado) / 2), qy = 700;
      g.fillStyle = "#ffffff";
      g.fillRect(qx - 30, qy - 30, lado + 60, lado + 60);
      g.strokeStyle = "#c9a24b"; g.lineWidth = 2;
      g.strokeRect(qx - 30, qy - 30, lado + 60, lado + 60);
      g.fillStyle = "#000000";
      for (let f = 0; f < n; f++) {
        for (let k = 0; k < n; k++) {
          if (qr.isDark(f, k)) g.fillRect(qx + (k + margen) * celda, qy + (f + margen) * celda, celda, celda);
        }
      }

      texto("Escaneá el código y mirá", 1400, "% Georgia, serif", 40, 960, "#555555");
      texto("las fotos en Instagram", 1446, "% Georgia, serif", 40, 960, "#555555");
      const evento = [x.honoree, x.eventType].filter(Boolean).join(" - ");
      if (evento) texto(evento, 1500, "italic % Georgia, serif", 36, 960, "#b8892b");
      return c.toDataURL("image/png");
    }

    function hashtag(id, x, boton, panel) {
      const campoTag = document.createElement("input");
      campoTag.placeholder = "#MisQuince"; campoTag.maxLength = 41;
      campoTag.value = x.hashtag ? "#" + x.hashtag : "";
      const guardar = h("button", "Guardar hashtag");
      const msg = h("p", "", "msg");
      const zona = h("div");
      panel.append(
        h("p", "Elegí el hashtag para que tus invitados compartan las fotos del evento. Aparece en la invitación como \"Un recuerdo con vos\"."),
        campoTag, guardar, msg, zona);

      function pintarTarjeta() {
        zona.textContent = "";
        const tag = limpiarTag(x.hashtag);
        if (!tag) return;
        const b = h("button", "Generar tarjeta con QR para las mesas", "sec");
        const salida = h("div");
        b.onclick = async () => {
          salida.textContent = "Generando la tarjeta...";
          try {
            const png = await generarTarjeta(tag, x);
            salida.textContent = "";
            salida.appendChild(h("p", "Tarjeta lista para imprimir y poner en las mesas (formato 3:4, por ejemplo 15 x 20 cm)."));
            const im = document.createElement("img");
            im.className = "vista"; im.src = png; im.alt = "Tarjeta del hashtag";
            salida.appendChild(im);
            const d = h("a", "Descargar tarjeta (PNG)", "boton-link");
            d.href = png; d.download = "tarjeta-hashtag-" + tag + ".png";
            const p = h("button", "Imprimir", "sec");
            p.onclick = () => {
              const w = window.open("", "_blank");
              if (!w) { alert("El navegador bloqueó la ventana. Descargá la tarjeta e imprimila desde tu galería."); return; }
              w.document.write("<!DOCTYPE html><html><head><meta charset='utf-8'><title>Tarjeta del hashtag</title>" +
                "<style>@page{margin:0}body{margin:0}img{width:100%;display:block}</style></head><body><img src='" + png + "'></body></html>");
              w.document.close();
              setTimeout(() => w.print(), 500);
            };
            salida.append(d, p);
          } catch (e) {
            console.error(e);
            salida.textContent = "No se pudo generar la tarjeta. Revisá tu conexión e intentá de nuevo.";
          }
        };
        zona.append(b, salida);
      }

      guardar.onclick = async () => {
        const tag = limpiarTag(campoTag.value);
        msg.textContent = "Guardando...";
        try {
          await updateDoc(doc(db, "invitations", id), { hashtag: tag, updatedAt: serverTimestamp() });
          x.hashtag = tag;
          campoTag.value = tag ? "#" + tag : "";
          msg.textContent = tag ? "Hashtag guardado." : "Hashtag quitado.";
          pintarTarjeta();
        } catch (e) {
          console.error(e);
          msg.textContent = "No se pudo guardar.";
        }
      };

      boton.onclick = () => { panel.hidden = !panel.hidden; };
      pintarTarjeta();
    }
  </script>
