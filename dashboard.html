<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dashboard - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0 auto;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px}
    h1,h2{color:#c9a24b}
    h3{margin:18px 0 6px;font-size:1rem;letter-spacing:2px;text-transform:uppercase;color:#8a6a1f}
    input,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    button.sec{background:#1a1a1a}
    a{color:#c9a24b}
    .menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .menu a{display:block;background:#1a1a1a;color:#fff;text-decoration:none;text-align:center;padding:14px 6px;border-radius:10px;font-size:.92rem}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
    .stat{background:#f6dde2;border-radius:12px;padding:12px;text-align:center;font-size:.85rem}
    .stat b{display:block;font-size:1.4rem;color:#8a6a1f}
    .caja{background:#fff;border:1px solid #eadfc8;border-radius:12px;padding:10px;margin:8px 0}
    .msg{min-height:1.4em}
  </style>
</head>
<body>
  <h1>KE Invitaciones</h1>

  <section id="login">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btn-login" type="button">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <h2>Gestión</h2>
    <div id="menu"></div>

    <h2>Estadísticas</h2>
    <div id="estado" class="msg">Cargando...</div>
    <div class="stats" id="stats" hidden></div>

    <h2>Próximos eventos</h2>
    <div id="proximos"></div>
    <button id="btn-actualizar" type="button">Actualizar</button>
    <button id="btn-salir" class="sec" type="button">Cerrar sesión</button>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { collection, getDocs }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    const $$ = (n) => "$" + Number(n || 0).toLocaleString("es-AR");

    const MENU = [
      ["Invitaciones", [
        ["Invitaciones", "admin.html"], ["Invitados", "invitados.html"],
        ["Extras (itinerario, playlist, hashtag)", "extras.html"], ["Vencimientos", "vencimientos.html"],
        ["Códigos QR", "qr.html"], ["Control de acceso", "acceso.html"]
      ]],
      ["Negocio", [
        ["Confirmaciones", "confirmaciones.html"], ["Pagos", "pagos.html"],
        ["Paquetes y precios", "paquetes.html"], ["Clientes", "clientes.html"]
      ]],
      ["Diseño", [
        ["Plantillas", "plantillas.html"], ["Plantillas nuevas", "plantillas-extra.html"]
      ]],
      ["Sitio", [
        ["Configuración", "configuracion.html"], ["Página principal", "index.html"],
        ["Vista de cliente", "cliente.html"]
      ]]
    ];

    MENU.forEach(([titulo, items]) => {
      const h = document.createElement("h3"); h.textContent = titulo;
      const g = document.createElement("div"); g.className = "menu";
      items.forEach(([t, url]) => {
        const a = document.createElement("a"); a.href = url; a.textContent = t; g.appendChild(a);
      });
      $("menu").append(h, g);
    });

    $("btn-login").addEventListener("click", async () => {
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
      } catch (e) { $("login-msg").textContent = "Email o contraseña incorrectos."; }
    });
    $("btn-salir").addEventListener("click", () => signOut(auth));
    $("btn-actualizar").addEventListener("click", cargar);

    onAuthStateChanged(auth, (u) => {
      $("login").hidden = !!u;
      $("panel").hidden = !u;
      if (u) cargar();
    });

    function tarjeta(valor, texto) {
      const c = document.createElement("div"); c.className = "stat";
      const b = document.createElement("b"); b.textContent = valor;
      c.append(b, texto);
      return c;
    }

    async function cargar() {
      $("estado").textContent = "Cargando...";
      $("stats").hidden = true;
      try {
        const [inv, pag, rsv, gst, ord, rvs] = await Promise.all([
          getDocs(collection(db, "invitations")),
          getDocs(collection(db, "payments")),
          getDocs(collection(db, "rsvps")),
          getDocs(collection(db, "guests")),
          getDocs(collection(db, "orders")),
          getDocs(collection(db, "resellers"))
        ]);

        const pagos = {};
        pag.forEach((d) => { pagos[d.id] = d.data(); });

        let activas = 0, premium = 0, basico = 0, ventas = 0, pend = 0, ingresos = 0, saldo = 0;
        const lista = [];
        inv.forEach((d) => {
          const x = d.data();
          if (x.active) activas++;
          if (x.package === "premium") premium++; else basico++;
          const p = pagos[d.id];
          const estado = p ? p.status : "pendiente";
          if (estado === "senado" || estado === "pagado") ventas++; else pend++;
          if (p) {
            ingresos += p.received || 0;
            saldo += Math.max((p.price || 0) - (p.received || 0), 0);
          }
          lista.push({ id: d.id, nombre: x.honoree || d.id, fecha: x.date || "" });
        });

        let personas = 0;
        rsv.forEach((d) => {
          const r = d.data();
          if (r.attending) personas += r.guests || 0;
        });

        let pedidosNuevos = 0, comisionPend = 0;
        ord.forEach((d) => {
          const o = d.data();
          if (o.status === "nuevo") pedidosNuevos++;
          if (!o.commissionPaid) {
            comisionPend += Math.round((o.collected || 0) * (o.commissionPct || 0) / 100);
          }
        });

        const s = $("stats");
        s.textContent = "";
        [
          [inv.size, "Invitaciones creadas"], [activas, "Activas"],
          [premium, "Paquete Premium"], [basico, "Paquete Básico"],
          [ventas, "Ventas (señadas o pagadas)"], [pend, "Pendientes de pago"],
          [$$(ingresos), "Ingresos cobrados"], [$$(saldo), "Saldo por cobrar"],
          [pedidosNuevos, "Pedidos nuevos"], [$$(comisionPend), "Comisiones a pagar"],
          [rvs.size, "Revendedores"], [rsv.size, "Confirmaciones recibidas"],
          [personas, "Personas confirmadas"], [gst.size, "Invitados cargados"]
        ].forEach(([v, t]) => s.appendChild(tarjeta(v, t)));
        s.hidden = false;
        $("estado").textContent = "";

        const hoy = new Date().toISOString().slice(0, 10);
        const prox = lista.filter((i) => i.fecha >= hoy)
          .sort((a, b) => a.fecha.localeCompare(b.fecha)).slice(0, 5);
        const cont = $("proximos");
        cont.textContent = "";
        if (!prox.length) cont.textContent = "No hay eventos próximos.";
        prox.forEach((i) => {
          const c = document.createElement("div"); c.className = "caja";
          const n = document.createElement("b"); n.textContent = i.nombre;
          const f = document.createElement("div"); f.textContent = i.fecha;
          const a = document.createElement("a");
          a.href = "confirmaciones.html?i=" + encodeURIComponent(i.id);
          a.textContent = "Ver confirmaciones";
          c.append(n, f, a);
          cont.appendChild(c);
        });
      } catch (e) {
        console.error(e);
        $("estado").textContent = "No se pudieron cargar las estadísticas.";
      }
    }
  </script>
  <script type="module" src="js/menu-extra.js"></script>
</body>
</html>
