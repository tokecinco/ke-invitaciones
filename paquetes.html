<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Paquetes - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0 auto;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px}
    h1,h2{color:#c9a24b}
    input,textarea,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    input[type=checkbox]{width:auto;margin:0 8px 0 0}
    textarea{min-height:80px}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    button.sec{background:#1a1a1a}
    label{font-size:.9rem;display:block;margin-top:10px}
    .check{display:flex;align-items:center;margin:8px 0;font-size:1rem}
    a{color:#c9a24b}
    .caja{background:#fff;border:1px solid #eadfc8;border-radius:12px;padding:14px;margin:12px 0}
    .aviso{background:#f6dde2;border-radius:10px;padding:8px 12px;margin:8px 0}
    .msg{min-height:1.4em}
  </style>
</head>
<body>
  <h1>Paquetes</h1>
  <p><a href="dashboard.html">Menú</a> - <a href="pagos.html">Pagos</a></p>

  <section id="login">
    <input id="email" type="email" placeholder="Email de administrador" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btn-login" type="button">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <p>Sesión: <b id="sesion-email"></b></p>
    <button id="btn-salir" class="sec" type="button">Cerrar sesión</button>
    <p id="admin-aviso" class="aviso" hidden></p>

    <div id="contenido">
      <p>Definí el precio y lo que incluye cada paquete. Podés cambiarlo cuando quieras.</p>
      <p id="aviso" class="aviso" hidden>Se actualizaron los paquetes (<b>Esencial</b> ahora incluye música de fondo y se eliminó Pase QR). Revisá los datos y tocá <b>Guardar paquetes</b> para aplicarlo.</p>
      <div id="paquetes"></div>
      <button id="btn-guardar" type="button">Guardar paquetes</button>
      <p id="msg" class="msg"></p>
    </div>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, setDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    const ADMIN_UID = "Ivb1LtWt6Eb8GkanORvC3C0Qx943";
    const PAQ = [["basico", "Paquete Esencial"], ["premium", "Paquete Premium"]];
    const DEFECTO = {
      basico:  { price: "", deposit: "", galeria: 6, music: true, personalized: false, description: "" },
      premium: { price: "", deposit: "", galeria: 8, music: true, personalized: true,  description: "" }
    };

    $("btn-login").addEventListener("click", async () => {
      $("login-msg").textContent = "Entrando...";
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
        $("login-msg").textContent = "";
      } catch (e) { $("login-msg").textContent = "Email o contraseña incorrectos."; }
    });
    $("btn-salir").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (u) => {
      if (!u || u.isAnonymous) {
        $("login").hidden = false;
        $("panel").hidden = true;
        return;
      }
      $("login").hidden = true;
      $("panel").hidden = false;
      $("sesion-email").textContent = u.email || u.uid;
      if (u.uid !== ADMIN_UID) {
        $("admin-aviso").textContent = "Iniciaste sesión con otra cuenta (" + (u.email || u.uid) + "), no con la cuenta administradora. Tocá \"Cerrar sesión\" y entrá como administrador.";
        $("admin-aviso").hidden = false;
        $("contenido").hidden = true;
        return;
      }
      $("admin-aviso").hidden = true;
      $("contenido").hidden = false;
      cargar();
    });

    function dibujar(datos) {
      const cont = $("paquetes");
      cont.textContent = "";
      PAQ.forEach(([k, titulo]) => {
        const d = datos[k];
        const c = document.createElement("div"); c.className = "caja";
        c.innerHTML =
          "<h2></h2>" +
          "<label>Precio ($)</label><input id='" + k + "-price' type='number' min='0' inputmode='numeric'>" +
          "<label>Seña ($)</label><input id='" + k + "-deposit' type='number' min='0' inputmode='numeric'>" +
          "<label>Fotos de la galería, sin contar la portada (de 0 a 8)</label><input id='" + k + "-fotos' type='number' min='0' max='8' inputmode='numeric'>" +
          "<label class='check'><input id='" + k + "-music' type='checkbox'>Incluye música de fondo</label>" +
          "<label class='check'><input id='" + k + "-guests' type='checkbox'>Incluye invitación personalizada y pase digital QR</label>" +
          "<label>Texto que se muestra en la página principal (opcional)</label>" +
          "<textarea id='" + k + "-desc' maxlength='300'></textarea>";
        c.querySelector("h2").textContent = titulo;
        cont.appendChild(c);
        $(k + "-price").value = d.price;
        $(k + "-deposit").value = d.deposit;
        $(k + "-fotos").value = d.galeria;
        $(k + "-music").checked = !!d.music;
        $(k + "-guests").checked = !!d.personalized;
        $(k + "-desc").value = d.description || "";
      });
    }

    async function cargar() {
      try {
        const s = await getDoc(doc(db, "settings", "packages"));
        const datos = JSON.parse(JSON.stringify(DEFECTO));
        if (s.exists()) {
          const g = s.data();
          ["basico", "premium"].forEach((k) => {
            if (!g[k]) return;
            datos[k].price = g[k].price ?? "";
            datos[k].deposit = g[k].deposit ?? "";
            datos[k].music = g.v3 === true ? !!g[k].music : true;
            datos[k].personalized = !!g[k].personalized;
            datos[k].description = g[k].description || "";
            if (g.v2 === true && g[k].maxPhotos >= 1) datos[k].galeria = g[k].maxPhotos - 1;
          });
          if (g.v3 !== true) $("aviso").hidden = false;
        } else {
          const p = await getDoc(doc(db, "settings", "pricing"));
          if (p.exists()) {
            datos.basico.price = p.data().price;
            datos.basico.deposit = p.data().deposit;
          }
        }
        dibujar(datos);
      } catch (e) {
        console.error(e);
        $("msg").textContent = "No se pudo cargar.";
      }
    }

    $("btn-guardar").addEventListener("click", async () => {
      const salida = {};
      for (const [k, titulo] of PAQ) {
        const price = parseInt($(k + "-price").value, 10);
        const deposit = parseInt($(k + "-deposit").value, 10);
        const galeria = parseInt($(k + "-fotos").value, 10);
        if (!(price >= 0)) { $("msg").textContent = titulo + ": falta el precio."; return; }
        if (!(deposit >= 0) || deposit > price) { $("msg").textContent = titulo + ": la seña no puede superar el precio."; return; }
        if (!(galeria >= 0 && galeria <= 8)) { $("msg").textContent = titulo + ": las fotos de la galería deben ser entre 0 y 8."; return; }
        salida[k] = {
          price: price, deposit: deposit, maxPhotos: galeria + 1,
          music: $(k + "-music").checked,
          personalized: $(k + "-guests").checked,
          description: $(k + "-desc").value.trim()
        };
      }
      $("msg").textContent = "Guardando...";
      try {
        salida.v2 = true;
        salida.v3 = true;
        salida.updatedAt = serverTimestamp();
        await setDoc(doc(db, "settings", "packages"), salida);
        $("aviso").hidden = true;
        $("msg").textContent = "Paquetes guardados.";
      } catch (e) {
        console.error(e);
        $("msg").textContent = "No se pudo guardar.";
      }
    });
  </script>
</body>
</html>
