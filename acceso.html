<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Control de acceso - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0 auto;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px}
    h1,h2{color:#c9a24b}
    input,select,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    button.sec{background:#1a1a1a}
    a{color:#c9a24b}
    label{font-size:.9rem;display:block;margin-top:8px}
    .tarjeta{border-radius:16px;padding:20px;text-align:center;color:#fff;margin:12px 0}
    .tarjeta.ok{background:#2e9e57}
    .tarjeta.ya{background:#d98e04}
    .tarjeta.mal{background:#c0392b}
    .tarjeta h2{color:#fff;margin:0 0 6px;letter-spacing:2px}
    .tarjeta .nombre{font-size:1.7rem;margin:6px 0}
    .tarjeta .mesa{font-size:1.6rem;font-weight:bold;background:rgba(255,255,255,.25);border-radius:12px;padding:6px;margin:8px 0}
    .tarjeta input,.tarjeta label{color:#1a1a1a}
    .tarjeta button{background:#1a1a1a}
    #camara{background:#000;border-radius:14px;padding:8px;margin:10px 0;text-align:center}
    #video{width:100%;border-radius:10px;max-height:60vh;object-fit:cover}
    #camara button{background:#c0392b}
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
    .stat{background:#f6dde2;border-radius:12px;padding:10px;text-align:center;font-size:.8rem}
    .stat b{display:block;font-size:1.3rem;color:#8a6a1f}
    .fila{background:#fff;border:1px solid #eadfc8;border-left:5px solid #ccc;border-radius:10px;padding:8px 10px;margin:6px 0}
    .fila.dentro{border-left-color:#2e9e57}
    .fila button{width:auto;padding:6px 12px;margin:6px 0 0;font-size:.85rem}
    .msg{min-height:1.4em}
  </style>
</head>
<body>
  <h1>Control de acceso</h1>
  <p id="menu"><a href="dashboard.html">Menú</a></p>

  <section id="login">
    <p>Entrá con tu cuenta, o abrí el enlace que te enviaron por WhatsApp.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btn-login" type="button">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <p id="modo"></p>

    <button id="btn-escanear" type="button">Escanear QR</button>
    <div id="camara" hidden>
      <video id="video" playsinline muted></video>
      <p id="msg-cam" class="msg" style="color:#fff"></p>
      <button id="btn-cerrar-cam" type="button">Cerrar cámara</button>
    </div>

    <div id="escaneo" hidden>
      <div id="tarjeta"></div>
    </div>

    <h2>Resumen de ingresos</h2>
    <select id="sel"></select>
    <div class="stats">
      <div class="stat"><b id="s-inv">0</b>Invitados</div>
      <div class="stat"><b id="s-dentro">0</b>Ya ingresaron</div>
      <div class="stat"><b id="s-pers">0</b>Personas dentro</div>
    </div>
    <input id="buscar" type="search" placeholder="Buscar por nombre o mesa">
    <div id="lista"></div>
    <button id="btn-salir" class="sec" type="button">Salir</button>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, signInAnonymously, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, setDoc, updateDoc, deleteField, serverTimestamp, collection, getDocs, query, where }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const pInv = params.get("i");
    const pGuest = params.get("g");
    const pDoor = params.get("d");
    let nombresInv = {};
    let guests = [];
    let anonimo = false;

    function el(tag, clase, texto) {
      const e = document.createElement(tag);
      if (clase) e.className = clase;
      if (texto) e.textContent = texto;
      return e;
    }
    const hora = (ts) => ts && ts.toDate
      ? ts.toDate().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }) : "";
    const ubicacion = (g) => [g.table ? "Mesa " + g.table : "", g.ticketType || ""].filter(Boolean).join(" - ");

    $("btn-login").addEventListener("click", async () => {
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
      } catch (e) { $("login-msg").textContent = "Email o contraseña incorrectos."; }
    });
    $("btn-salir").addEventListener("click", () => {
      detener();
      signOut(auth).then(() => { location.href = location.pathname; });
    });

    function mostrarPanel() { $("login").hidden = true; $("panel").hidden = false; }

    onAuthStateChanged(auth, async (u) => {
      if (!u) {
        if (pInv && pDoor) {
          mostrarPanel();
          $("modo").textContent = "Entrando con tu código...";
          try { await signInAnonymously(auth); }
          catch (e) {
            console.error(e);
            $("modo").textContent = "No se pudo iniciar el acceso por código. Avisale al administrador.";
          }
          return;
        }
        $("login").hidden = false;
        $("panel").hidden = true;
        return;
      }
      mostrarPanel();
      anonimo = u.isAnonymous;
      if (anonimo) await modoCodigo(u); else await modoCuenta();
    });

    /* Acceso con código (sin cuenta) */
    async function modoCodigo(u) {
      $("modo").textContent = "Acceso por código";
      $("menu").hidden = true;
      if (!pInv) { $("lista").textContent = "Abrí el enlace que te enviaron por WhatsApp para controlar el acceso."; return; }
      if (pDoor) {
        try {
          await setDoc(doc(db, "doorGrants", u.uid + "_" + pInv), {
            invitationId: pInv, code: pDoor, uid: u.uid, createdAt: serverTimestamp()
          });
        } catch (e) {
          console.error(e);
          $("lista").textContent = "El código no es válido o ya no está vigente. Pedí un enlace nuevo.";
          return;
        }
      }
      try {
        const s = await getDoc(doc(db, "invitations", pInv));
        if (!s.exists()) { $("lista").textContent = "No se encontró la invitación."; return; }
        nombresInv = { [pInv]: s.data().honoree || pInv };
        $("sel").innerHTML = "";
        const o = document.createElement("option");
        o.value = pInv; o.textContent = nombresInv[pInv];
        $("sel").appendChild(o);
      } catch (e) {
        console.error(e);
        $("lista").textContent = "No se pudo abrir el control de acceso. Pedí un enlace nuevo.";
        return;
      }
      await cargarLista();
      if (pGuest) verificar(pInv, pGuest);
    }

    /* Acceso con cuenta */
    async function modoCuenta() {
      $("modo").textContent = "Sesión iniciada";
      await cargarInvitaciones();
      if (pInv && pGuest) verificar(pInv, pGuest);
    }

    async function cargarInvitaciones() {
      let snap;
      try {
        snap = await getDocs(collection(db, "invitations"));
      } catch (e) {
        try {
          snap = await getDocs(query(collection(db, "invitations"), where("ownerId", "==", auth.currentUser.uid)));
        } catch (e2) { console.error(e2); $("lista").textContent = "No se pudieron cargar las invitaciones."; return; }
      }
      $("sel").innerHTML = "";
      nombresInv = {};
      snap.forEach((d) => {
        nombresInv[d.id] = d.data().honoree || d.id;
        const o = document.createElement("option");
        o.value = d.id; o.textContent = nombresInv[d.id];
        $("sel").appendChild(o);
      });
      if (pInv && nombresInv[pInv]) $("sel").value = pInv;
      if (!snap.size) { $("lista").textContent = "No hay invitaciones."; return; }
      cargarLista();
    }

    /* Verificación de un pase */
    async function verificar(inv, g) {
      $("escaneo").hidden = false;
      $("tarjeta").textContent = "Verificando...";
      try {
        const [gs, iv] = await Promise.all([
          getDoc(doc(db, "guests", g)),
          getDoc(doc(db, "invitations", inv))
        ]);
        if (!gs.exists() || !iv.exists() || gs.data().invitationId !== inv) {
          return tarjeta("mal", "QR NO VÁLIDO", "Este código no corresponde a una invitación.", null);
        }
        pintar(inv, g, gs.data(), iv.data());
      } catch (e) {
        console.error(e);
        tarjeta("mal", "SIN PERMISO", "Esta sesión no puede controlar esta invitación.", null);
      }
    }

    function tarjeta(clase, titulo, texto, extra) {
      const t = $("tarjeta");
      t.textContent = "";
      const c = el("div", "tarjeta " + clase);
      c.append(el("h2", null, titulo), el("p", null, texto));
      if (extra) c.appendChild(extra);
      t.appendChild(c);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function pintar(inv, gid, g, iv) {
      const caja = el("div");
      caja.appendChild(el("div", "nombre", g.name));
      caja.appendChild(el("p", null, (iv.honoree || "") + " - " + g.seats + (g.seats === 1 ? " lugar" : " lugares")));
      const u = ubicacion(g);
      if (u) caja.appendChild(el("div", "mesa", u));

      if (g.checkedIn) {
        const b = el("button", null, "Deshacer ingreso");
        b.type = "button";
        b.onclick = async () => {
          if (!confirm("¿Deshacer el ingreso de " + g.name + "?")) return;
          try {
            await updateDoc(doc(db, "guests", gid), {
              checkedIn: deleteField(), checkedInAt: deleteField(), checkedInCount: deleteField()
            });
            verificar(inv, gid); cargarLista();
          } catch (e) { console.error(e); alert("No se pudo deshacer."); }
        };
        caja.appendChild(b);
        tarjeta("ya", "YA INGRESÓ", (g.checkedInCount || 0) + " persona(s) a las " + hora(g.checkedInAt), caja);
      } else {
        const l = el("label", null, "Personas que ingresan");
        const n = document.createElement("input");
        n.type = "number"; n.min = "1"; n.max = String(g.seats); n.value = String(g.seats);
        n.inputMode = "numeric";
        const b = el("button", null, "Registrar ingreso");
        b.type = "button";
        b.onclick = async () => {
          const cant = parseInt(n.value, 10);
          if (!(cant >= 1 && cant <= g.seats)) { alert("La cantidad debe ser entre 1 y " + g.seats + "."); return; }
          b.disabled = true;
          try {
            await updateDoc(doc(db, "guests", gid), {
              checkedIn: true, checkedInAt: serverTimestamp(), checkedInCount: cant
            });
            verificar(inv, gid); cargarLista();
          } catch (e) { console.error(e); alert("No se pudo registrar el ingreso."); b.disabled = false; }
        };
        caja.append(l, n, b);
        tarjeta("ok", "PASE VÁLIDO", "Todavía no ingresó.", caja);
      }
    }

    /* Lista y búsqueda */
    $("sel").addEventListener("change", cargarLista);
    $("buscar").addEventListener("input", pintarLista);

    async function cargarLista() {
      const id = $("sel").value;
      if (!id) return;
      $("lista").textContent = "Cargando...";
      try {
        const snap = await getDocs(query(collection(db, "guests"), where("invitationId", "==", id)));
        guests = snap.docs.map((d) => ({ id: d.id, x: d.data() }))
          .sort((a, b) => a.x.name.localeCompare(b.x.name, "es"));
        pintarLista();
      } catch (e) {
        console.error(e);
        $("lista").textContent = "No se pudo cargar la lista.";
      }
    }

    async function manual(gid, x) {
      const v = prompt("Personas que ingresan (de " + x.seats + "):", String(x.seats));
      if (v === null) return;
      const n = parseInt(v, 10);
      if (!(n >= 1 && n <= x.seats)) { alert("La cantidad debe ser entre 1 y " + x.seats + "."); return; }
      try {
        await updateDoc(doc(db, "guests", gid), {
          checkedIn: true, checkedInAt: serverTimestamp(), checkedInCount: n
        });
        cargarLista();
      } catch (e) { console.error(e); alert("No se pudo registrar el ingreso."); }
    }

    function pintarLista() {
      let dentro = 0, personas = 0;
      guests.forEach(({ x }) => { if (x.checkedIn) { dentro++; personas += x.checkedInCount || 0; } });
      $("s-inv").textContent = guests.length;
      $("s-dentro").textContent = dentro;
      $("s-pers").textContent = personas;

      const t = $("buscar").value.trim().toLowerCase();
      const cont = $("lista");
      cont.textContent = "";
      const vis = guests.filter(({ x }) =>
        !t || x.name.toLowerCase().includes(t) || String(x.table || "").toLowerCase() === t);
      if (!guests.length) { cont.textContent = "Todavía no hay invitados cargados."; return; }
      if (!vis.length) { cont.textContent = "No hay resultados."; return; }

      vis.forEach(({ id, x }) => {
        const f = el("div", "fila" + (x.checkedIn ? " dentro" : ""));
        f.appendChild(el("b", null, x.name));
        const u = ubicacion(x);
        f.appendChild(el("div", null, x.checkedIn
          ? "Ingresó a las " + hora(x.checkedInAt) + " (" + (x.checkedInCount || 0) + " de " + x.seats + ")" + (u ? " - " + u : "")
          : x.seats + " lugar(es)" + (u ? " - " + u : "") + " - todavía no ingresó"));
        if (!x.checkedIn) {
          const b = el("button", null, "Registrar ingreso");
          b.type = "button";
          b.onclick = () => manual(id, x);
          f.appendChild(b);
        }
        cont.appendChild(f);
      });
    }

    /* Escáner de QR dentro de la página */
    let stream = null, escaneando = false;

    function cargarScript(src) {
      return new Promise((ok, mal) => {
        const s = document.createElement("script");
        s.src = src; s.onload = ok; s.onerror = () => mal(new Error("script"));
        document.head.appendChild(s);
      });
    }

    function detener() {
      escaneando = false;
      if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
      $("camara").hidden = true;
    }
    $("btn-cerrar-cam").addEventListener("click", detener);

    function procesar(texto) {
      try {
        const u = new URL(texto);
        const i = u.searchParams.get("i"), g = u.searchParams.get("g");
        if (!i || !g || !/acceso\.html$/.test(u.pathname)) return false;
        if ($("sel").value !== i && nombresInv[i]) { $("sel").value = i; cargarLista(); }
        verificar(i, g);
        return true;
      } catch (e) { return false; }
    }

    $("btn-escanear").addEventListener("click", async () => {
      $("camara").hidden = false;
      $("msg-cam").textContent = "";
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      } catch (e) {
        $("msg-cam").textContent = "No se pudo abrir la cámara. Revisá el permiso o escaneá con la cámara del celular.";
        return;
      }
      const v = $("video");
      v.srcObject = stream;
      await v.play();
      escaneando = true;

      let detector = null;
      if ("BarcodeDetector" in window) {
        try { detector = new window.BarcodeDetector({ formats: ["qr_code"] }); } catch (e) {}
      }
      if (!detector && !window.jsQR) {
        try { await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"); }
        catch (e) {
          $("msg-cam").textContent = "Este celular no permite escanear desde la página. Usá la cámara del celular.";
          detener();
          return;
        }
      }
      $("msg-cam").textContent = "Apuntá la cámara al código QR.";

      const lienzo = document.createElement("canvas");
      const ctx = lienzo.getContext("2d", { willReadFrequently: true });
      const ciclo = async () => {
        if (!escaneando) return;
        let texto = "";
        try {
          if (detector) {
            const r = await detector.detect(v);
            if (r.length) texto = r[0].rawValue;
          } else if (v.videoWidth) {
            lienzo.width = v.videoWidth; lienzo.height = v.videoHeight;
            ctx.drawImage(v, 0, 0);
            const img = ctx.getImageData(0, 0, lienzo.width, lienzo.height);
            const r = window.jsQR(img.data, img.width, img.height);
            if (r) texto = r.data;
          }
        } catch (e) {}
        if (texto && procesar(texto)) { detener(); return; }
        setTimeout(() => requestAnimationFrame(ciclo), 150);
      };
      ciclo();
    });
  </script>
</body>
  </html>
