<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px;margin:0 auto}
    h1,h2{color:#c9a24b}
    input,select,textarea,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    textarea{min-height:70px}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    button.sec{background:#1a1a1a}
    label{font-size:.9rem;display:block;margin-top:8px}
    .tarjeta{background:#fff;border:1px solid #eadfc8;border-radius:12px;padding:12px;margin:10px 0}
    .tarjeta button{width:auto;padding:8px 14px;margin:4px 4px 0 0}
    .msg{min-height:1.4em}
    .fotos img{width:60px;height:60px;object-fit:cover;border-radius:8px;margin:3px}
  </style>
</head>
<body>
  <h1>KE Invitaciones - Panel</h1>

  <section id="login">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btn-login" type="button">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <button id="btn-salir" class="sec" type="button">Cerrar sesión</button>

    <h2>Nueva invitación</h2>
    <form id="form" novalidate>
      <label>Plantilla</label>
      <select id="f-template">
        <option value="cumple">Cumpleaños infantil</option>
        <option value="quince">15 años</option>
        <option value="boda">Casamiento</option>
      </select>
      <input id="f-honoree" placeholder="Nombre del homenajeado" maxlength="80">
      <input id="f-tipo" placeholder="Tipo de evento (ej: Mis 15 años)" maxlength="60">
      <label>Fecha</label><input id="f-fecha" type="date">
      <label>Hora</label><input id="f-hora" type="time">
      <input id="f-salon" placeholder="Nombre del salón" maxlength="80">
      <input id="f-dir" placeholder="Dirección" maxlength="120">
      <input id="f-maps" placeholder="Enlace de Google Maps (https://...)">
      <input id="f-bienvenida" placeholder="Texto de bienvenida" maxlength="120">
      <textarea id="f-mensaje" placeholder="Mensaje personalizado" maxlength="400"></textarea>
      <textarea id="f-info" placeholder="Información adicional" maxlength="400"></textarea>
      <input id="f-whatsapp" placeholder="WhatsApp para confirmar (ej: 5491112345678)">
      <input id="f-musica" placeholder="Enlace de música (https://... .mp3) opcional">
      <label>Fotos (hasta 4, la primera es la portada)</label>
      <input id="f-fotos" type="file" accept="image/*" multiple>
      <div id="vista-fotos" class="fotos"></div>
      <button id="btn-crear" type="submit">Crear invitación</button>
      <p id="f-msg" class="msg"></p>
    </form>

    <h2>Mis invitaciones</h2>
    <div id="lista"></div>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, setDoc, updateDoc, collection, getDocs, query, orderBy, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    let fotos = [];

    $("btn-login").addEventListener("click", async () => {
      $("login-msg").textContent = "Entrando...";
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
        $("login-msg").textContent = "";
      } catch (e) {
        $("login-msg").textContent = "Email o contraseña incorrectos.";
      }
    });
    $("btn-salir").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (u) => {
      $("login").hidden = !!u;
      $("panel").hidden = !u;
      if (u) listar();
    });

    function slug(t) {
      return t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50);
    }
    function linkDe(id) {
      return location.origin + location.pathname.replace(/admin\.html$/, "") + "i/" + id;
    }

    function comprimir(archivo) {
      return new Promise((ok, mal) => {
        const img = new Image();
        const url = URL.createObjectURL(archivo);
        img.onload = () => {
          const max = 800;
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * k);
          c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          ok(c.toDataURL("image/jpeg", 0.6));
        };
        img.onerror = () => mal(new Error("imagen"));
        img.src = url;
      });
    }

    $("f-fotos").addEventListener("change", async (e) => {
      const archivos = Array.from(e.target.files).slice(0, 4);
      $("f-msg").textContent = "Procesando fotos...";
      try {
        fotos = [];
        for (const a of archivos) fotos.push(await comprimir(a));
        $("vista-fotos").innerHTML = "";
        fotos.forEach((src) => {
          const i = document.createElement("img"); i.src = src;
          $("vista-fotos").appendChild(i);
        });
        $("f-msg").textContent = fotos.length + " foto(s) lista(s).";
      } catch (err) {
        fotos = [];
        $("f-msg").textContent = "No se pudo leer una de las fotos.";
      }
    });

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $("f-msg");
      const honoree = $("f-honoree").value.trim();
      const tipo = $("f-tipo").value.trim();
      const fecha = $("f-fecha").value;
      const maps = $("f-maps").value.trim();
      const musica = $("f-musica").value.trim();

      if (!honoree) { msg.textContent = "Falta el nombre del homenajeado."; return; }
      if (!fecha) { msg.textContent = "Falta la fecha."; return; }
      if (maps && !/^https:\/\//i.test(maps)) { msg.textContent = "El enlace de Maps debe empezar con https://"; return; }
      if (musica && !/^https:\/\//i.test(musica)) { msg.textContent = "El enlace de música debe empezar con https://"; return; }
      if (fotos.join("").length > 900000) { msg.textContent = "Las fotos pesan demasiado. Usá menos fotos."; return; }

      $("btn-crear").disabled = true;
      msg.textContent = "Creando...";
      try {
        let id = slug(honoree + " " + tipo) || "invitacion";
        const existe = await getDoc(doc(db, "invitations", id));
        if (existe.exists()) id += "-" + Math.random().toString(36).slice(2, 6);

        await setDoc(doc(db, "invitations", id), {
          active: true,
          ownerId: auth.currentUser.uid,
          template: $("f-template").value,
          honoree: honoree,
          eventType: tipo,
          date: fecha,
          time: $("f-hora").value,
          venue: $("f-salon").value.trim(),
          address: $("f-dir").value.trim(),
          mapsUrl: maps,
          welcome: $("f-bienvenida").value.trim(),
          message: $("f-mensaje").value.trim(),
          info: $("f-info").value.trim(),
          whatsapp: $("f-whatsapp").value.trim(),
          music: musica,
          photos: fotos,
          createdAt: serverTimestamp()
        });
        msg.textContent = "Creada. Enlace: " + linkDe(id);
        $("form").reset(); fotos = []; $("vista-fotos").innerHTML = "";
        listar();
      } catch (err) {
        console.error(err);
        msg.textContent = "No se pudo crear. Revisá que hayas entrado con la cuenta administradora.";
      }
      $("btn-crear").disabled = false;
    });

    async function listar() {
      const cont = $("lista");
      cont.textContent = "Cargando...";
      try {
        const q = query(collection(db, "invitations"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        cont.textContent = "";
        if (snap.empty) { cont.textContent = "Todavía no hay invitaciones."; return; }
        snap.forEach((d) => {
          const x = d.data();
          const t = document.createElement("div"); t.className = "tarjeta";
          const n = document.createElement("b"); n.textContent = x.honoree || d.id;
          const est = document.createElement("div");
          est.textContent = (x.active ? "Activa" : "Desactivada") + " - " + (x.date || "");
          const a = document.createElement("a");
          a.href = linkDe(d.id); a.textContent = linkDe(d.id); a.target = "_blank";
          a.style.wordBreak = "break-all";
          const b1 = document.createElement("button");
          b1.textContent = "Copiar enlace";
          b1.onclick = () => navigator.clipboard.writeText(linkDe(d.id)).then(() => { b1.textContent = "Copiado"; });
          const b2 = document.createElement("button");
          b2.className = "sec";
          b2.textContent = x.active ? "Desactivar" : "Activar";
          b2.onclick = async () => {
            await updateDoc(doc(db, "invitations", d.id), { active: !x.active });
            listar();
          };
          t.append(n, est, a, document.createElement("br"), b1, b2);
          cont.appendChild(t);
        });
      } catch (err) {
        console.error(err);
        cont.textContent = "No se pudo cargar la lista.";
      }
    }
  </script>
</body>
  </html>
