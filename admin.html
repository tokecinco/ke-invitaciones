<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0 auto;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px}
    h1,h2{color:#c9a24b}
    input,select,textarea,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    input[type=checkbox]{width:auto;margin:0 8px 0 0}
    input:disabled,textarea:disabled{background:#eee}
    textarea{min-height:70px}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    button.sec{background:#1a1a1a}
    button.rojo{background:#c0392b}
    label{font-size:.9rem;display:block;margin-top:8px}
    .check{display:flex;align-items:center;margin:8px 0;font-size:.95rem}
    a{color:#c9a24b}
    .tarjeta{background:#fff;border:1px solid #eadfc8;border-radius:12px;padding:12px;margin:10px 0}
    .tarjeta button{width:auto;padding:8px 12px;margin:4px 4px 0 0;font-size:.9rem}
    .msg{min-height:1.4em}
    .fotos img{width:60px;height:60px;object-fit:cover;border-radius:8px;margin:3px}
    .muestra-prev{width:150px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1px solid #d8cbb0;display:block;margin:6px 0}
    .aviso{background:#f6dde2;border-radius:10px;padding:8px 12px}
  </style>
</head>
<body>
  <h1>KE Invitaciones - Panel</h1>

  <section id="login">
    <input id="email" type="email" placeholder="Email de administrador" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btn-login" type="button">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <p><a href="dashboard.html">Menú</a> - <a href="confirmaciones.html">Confirmaciones</a> - <a href="pagos.html">Pagos</a> - <a href="paquetes.html">Paquetes</a></p>
    <p>Sesión: <b id="sesion-email"></b></p>
    <button id="btn-salir" class="sec" type="button">Cerrar sesión</button>
    <p id="admin-aviso" class="aviso" hidden></p>

    <div id="contenido">
      <h2 id="titulo-form">Nueva invitación</h2>
      <p id="aviso-edicion" class="aviso" hidden></p>
      <form id="form" novalidate>
        <label>Paquete</label>
        <select id="f-paquete">
          <option value="basico">Esencial</option>
          <option value="premium">Premium</option>
        </select>
        <label>Plantilla</label>
        <select id="f-template">
          <option value="cumple">Cumpleaños infantil</option>
          <option value="quince">15 años</option>
          <option value="boda">Casamiento</option>
        </select>
        <input id="f-honoree" placeholder="Nombre del homenajeado" maxlength="80">
        <input id="f-tipo" placeholder="Tipo de evento (ej: Mis 15 años)" maxlength="60">
        <label>Fecha</label><input id="f-fecha" type="date">
        <label>Hora</label><input id="f-hora" type="time">
        <input id="f-salon" placeholder="Nombre del salón" maxlength="80">
        <input id="f-dir" placeholder="Dirección" maxlength="120">
        <input id="f-maps" placeholder="Enlace de Google Maps (https://...)">
        <input id="f-lugar1-etq" placeholder="Título de este lugar (opcional, ej: Ceremonia religiosa)" maxlength="40">
        <label class="check"><input id="f-lugar2-on" type="checkbox">Agregar un segundo lugar (ej: ceremonia en una iglesia y fiesta en un salón)</label>
        <div id="bloque-lugar2" hidden>
          <input id="f-lugar2-etq" placeholder="Título del segundo lugar (ej: Fiesta)" maxlength="40">
          <label>Hora del segundo lugar (opcional)</label><input id="f-hora2" type="time">
          <input id="f-salon2" placeholder="Nombre del salón / lugar" maxlength="80">
          <input id="f-dir2" placeholder="Dirección" maxlength="120">
          <input id="f-maps2" placeholder="Enlace de Google Maps (https://...)">
        </div>
        <input id="f-bienvenida" placeholder="Texto de bienvenida" maxlength="120">
        <textarea id="f-mensaje" placeholder="Mensaje personalizado" maxlength="400"></textarea>
        <textarea id="f-info" placeholder="Información adicional" maxlength="400"></textarea>
        <input id="f-dress" placeholder="Dress code (ej: Elegante sport)" maxlength="120">
        <textarea id="f-regalo" placeholder="Regalo (ej: alias para transferir, o 'Tu presencia es el mejor regalo')" maxlength="300"></textarea>
        <input id="f-whatsapp" placeholder="WhatsApp para confirmar (ej: 5491112345678)">
        <input id="f-musica" placeholder="Enlace de música (https://... .mp3) opcional">
        <label id="lbl-fotos">Fotos (la primera es la portada)</label>
        <label>Tipo de galería</label>
        <select id="f-galeria">
          <option value="">Estándar (la de siempre)</option>
          <option value="polaroid">Galería Polaroid</option>
          <option value="masonry">Galería Masonry</option>
          <option value="revista">Editorial revista</option>
          <option value="pelicula">Tira de película</option>
          <option value="carrusel">Carrusel</option>
        </select>
        <input id="f-fotos" type="file" accept="image/*" multiple>
        <div id="vista-fotos" class="fotos"></div>
        <label class="check"><input id="f-guardar-muestra" type="checkbox">Usar la portada de esta invitación (con título) como muestra de la plantilla</label>
        <img id="vista-muestra-tpl" class="muestra-prev" alt="Vista previa de muestra" hidden>
        <label class="check"><input id="f-firma" type="checkbox" checked>Mostrar firma de KE Invitaciones al final</label>
        <button id="btn-crear" type="submit">Crear invitación</button>
        <button id="btn-cancelar" class="sec" type="button" hidden>Cancelar edición</button>
        <p id="f-msg" class="msg"></p>
      </form>

      <h2>Mis invitaciones</h2>
      <input id="buscar" type="search" placeholder="Buscar por nombre">
      <select id="filtro">
        <option value="">Todas las plantillas</option>
        <option value="cumple">Cumpleaños infantil</option>
        <option value="quince">15 años</option>
        <option value="boda">Casamiento</option>
      </select>
      <div id="lista"></div>
    </div>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs, query, orderBy, where, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { buscarFuente, cargarFuente } from "./js/fuentes.js";

    const $ = (id) => document.getElementById(id);
    const ADMIN_UID = "Ivb1LtWt6Eb8GkanORvC3C0Qx943";
    const ETIQ_PAQ = { basico: "Esencial", premium: "Premium", pase: "Pase QR (ant.)" };
    const LEGACY_TPL = {
      cumple: { colors: { fondo: "#fff6e0", texto: "#1a1a1a", acento: "#e8833a", suave: "#ffd9e6" }, font: "'Trebuchet MS', sans-serif" },
      quince: { colors: { fondo: "#fdf0f4", texto: "#1a1a1a", acento: "#b8860b", suave: "#f6dde2" }, font: "Georgia, serif" },
      boda:   { colors: { fondo: "#ffffff", texto: "#1a1a1a", acento: "#c9a24b", suave: "#f3efe6" }, font: "Georgia, serif" }
    };
    let paquetes = {
      basico:  { maxPhotos: 7, music: true },
      premium: { maxPhotos: 9, music: true }
    };
    let fotos = [];
    let fotosExistentes = [];
    let editId = null;
    let pedidoId = null;
    let todas = [];
    let tplDatos = {};
    let muestraGenerada = "";

    $("btn-login").addEventListener("click", async () => {
      $("login-msg").textContent = "Entrando...";
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
        $("login-msg").textContent = "";
      } catch (e) {
        $("login-msg").textContent = "Email o contraseña incorrectos.";
      }
    });
    $("btn-salir").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (u) => {
      if (!u || u.isAnonymous) {
        $("login").hidden = false;
        $("panel").hidden = true;
        return;
      }
      $("login").hidden = true;
      $("panel").hidden = false;
      $("sesion-email").textContent = u.email || u.uid;
      if (u.uid !== ADMIN_UID) {
        $("admin-aviso").textContent = "Iniciaste sesión con otra cuenta (" + (u.email || u.uid) + "), no con la cuenta administradora. Tocá \"Cerrar sesión\" y entrá como administrador.";
        $("admin-aviso").hidden = false;
        $("contenido").hidden = true;
        return;
      }
      $("admin-aviso").hidden = true;
      $("contenido").hidden = false;
      cargarPaquetes().then(() => cargarPedido());
      listar();
    });

    async function cargarPaquetes() {
      try {
        const [s, tp] = await Promise.all([
          getDoc(doc(db, "settings", "packages")),
          getDocs(collection(db, "templates"))
        ]);
        if (s.exists()) {
          const g = s.data();
          ["basico", "premium"].forEach((k) => {
            if (g[k]) paquetes[k] = {
              maxPhotos: g[k].maxPhotos || paquetes[k].maxPhotos,
              music: g.v3 === true ? !!g[k].music : true
            };
          });
        }
        tplDatos = {};
        tp.forEach((d) => { tplDatos[d.id] = d.data(); });
      } catch (e) { console.error(e); }
      aplicarLimites();
    }

    async function cargarPedido() {
      const pid = new URLSearchParams(location.search).get("pedido");
      if (!pid || editId) return;
      try {
        const s = await getDoc(doc(db, "orders", pid));
        if (!s.exists()) return;
        const o = s.data();
        const d = o.invitationData || {};
        pedidoId = pid;
        if (o.product && ["basico", "premium"].includes(o.product)) {
          $("f-paquete").value = o.product;
          aplicarLimites();
        }
        if (d.template) {
          const sel = $("f-template");
          if (!Array.from(sel.options).some((op) => op.value === d.template)) {
            const op = document.createElement("option");
            op.value = d.template;
            op.textContent = d.templateName || d.template;
            sel.appendChild(op);
          }
          sel.value = d.template;
        }
        $("f-honoree").value = d.honoree || "";
        $("f-tipo").value = o.eventType || "";
        $("f-fecha").value = o.eventDate || "";
        $("f-hora").value = d.eventTime || "";
        $("f-salon").value = d.venue || "";
        $("f-dir").value = d.address || "";
        $("f-maps").value = d.mapsUrl || "";
        $("f-bienvenida").value = d.welcome || "";
        $("f-mensaje").value = d.message || "";
        $("f-dress").value = d.dressCode || "";
        $("f-regalo").value = d.gift || "";
        const tel = String(o.clientPhone || "").replace(/\D/g, "");
        if (tel) $("f-whatsapp").value = tel;
        if (o.notes) $("f-info").value = o.notes;
        $("aviso-edicion").textContent = "Datos precargados del envío de " + (o.clientName || "cliente") +
          (o.resellerCode ? " (revendedor: " + o.resellerCode + ")" : "") +
          ". Agregá las fotos y tocá Crear invitación.";
        $("aviso-edicion").hidden = false;
      } catch (e) { console.error(e); }
    }

    function limites() { return paquetes[$("f-paquete").value] || paquetes.basico; }

    function aplicarLimites() {
      const l = limites();
      $("lbl-fotos").textContent = "Fotos: la primera es la portada, más hasta " + Math.max(l.maxPhotos - 1, 0) + " de galería";
      $("f-musica").disabled = !l.music;
      $("f-musica").placeholder = l.music
        ? "Enlace de música (https://... .mp3) opcional"
        : "Música: no incluida en este paquete";
      if (!l.music) $("f-musica").value = "";
    }
    $("f-paquete").addEventListener("change", aplicarLimites);

    function slug(t) {
      return t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50);
    }
    function azar() { return Math.random().toString(36).slice(2, 6); }
    function linkDe(id) {
      return location.origin + location.pathname.replace(/admin\.html$/, "") + "i/" + id;
    }

    function comprimir(archivo, esPortada) {
      return new Promise((ok, mal) => {
        const img = new Image();
        const url = URL.createObjectURL(archivo);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let max = esPortada ? 1400 : 820;
          let q = esPortada ? 0.84 : 0.72;
          const tope = esPortada ? 240000 : 90000;
          let out = "";
          for (let i = 0; i < 6; i++) {
            const k = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement("canvas");
            c.width = Math.round(img.width * k);
            c.height = Math.round(img.height * k);
            const ctx = c.getContext("2d");
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage(img, 0, 0, c.width, c.height);
            out = c.toDataURL("image/webp", q);
            if (!out.startsWith("data:image/webp")) out = c.toDataURL("image/jpeg", q);
            if (out.length <= tope) break;
            max = Math.round(max * 0.88);
            q = Math.max(0.55, q - 0.05);
          }
          ok(out);
        };
        img.onerror = () => mal(new Error("imagen"));
        img.src = url;
      });
    }

    /* Genera la imagen 3:4 de muestra de la plantilla usando la portada y el título de esta invitación */
    function cargarImg(src) {
      return new Promise((ok) => {
        if (!src) return ok(null);
        const im = new Image();
        im.crossOrigin = "anonymous";
        im.onload = () => ok(im);
        im.onerror = () => ok(null);
        im.src = src;
      });
    }

    function partirLineas(g, texto, maxW, maxLineas) {
      const palabras = String(texto || "").trim().split(/\s+/).filter(Boolean);
      const out = [];
      let act = "";
      for (const p of palabras) {
        const pr = act ? act + " " + p : p;
        if (g.measureText(pr).width <= maxW) act = pr;
        else {
          if (act) out.push(act);
          act = p;
          if (out.length === maxLineas - 1) break;
        }
      }
      if (act && out.length < maxLineas) out.push(act);
      return out;
    }

    function dibujarCover(g, im, x, y, w, h) {
      const rImg = im.width / im.height;
      const rBox = w / h;
      let sx = 0, sy = 0, sw = im.width, sh = im.height;
      if (rImg > rBox) {
        sw = im.height * rBox;
        sx = (im.width - sw) / 2;
      } else {
        sh = im.width / rBox;
        sy = (im.height - sh) / 2;
      }
      g.drawImage(im, sx, sy, sw, sh, x, y, w, h);
    }

    async function generarMuestraPortada() {
      const tplId = $("f-template").value;
      const tpl = tplDatos[tplId] || LEGACY_TPL[tplId] || LEGACY_TPL.boda;
      const col = tpl.colors || {};
      const fondo = col.fondo || "#fffaf3";
      const texto = col.texto || "#1a1a1a";
      const acento = col.acento || "#c9a24b";
      const suave = col.suave || "#f6dde2";
      const estiloFondo = tpl.fondo || "";

      const f = tpl.fonts || {};
      const fTit = f.titulo || tpl.font || "Georgia, serif";
      const fTxt = f.texto || tpl.font || "Georgia, serif";
      const bTit = buscarFuente(fTit);
      const bTxt = buscarFuente(fTxt);
      cargarFuente(bTit);
      cargarFuente(bTxt);
      const pesoTit = (bTit && bTit.peso) ? bTit.peso + " " : "";
      if (document.fonts) {
        await Promise.race([
          Promise.all([
            document.fonts.ready,
            document.fonts.load(pesoTit + "64px " + fTit).catch(() => {}),
            document.fonts.load("26px " + fTxt).catch(() => {})
          ]),
          new Promise((r) => setTimeout(r, 1200))
        ]);
      }

      const fotoSrc = fotos.length ? fotos[0] : (fotosExistentes[0] || "");
      const im = await cargarImg(fotoSrc);

      const W = 600, H = 800;
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const g = c.getContext("2d");

      const conMarco = ["boda-salvia", "boda-terracota", "arco-fino", "botanico", "boho", "lila", "marco-oval", "glam"].includes(estiloFondo);
      const esOval = ["lila", "marco-oval"].includes(estiloFondo);
      const esPill = estiloFondo === "glam";

      g.fillStyle = fondo;
      g.fillRect(0, 0, W, H);

      const honoree = $("f-honoree").value.trim() || tpl.name || "Invitación";
      const tipo = $("f-tipo").value.trim();
      const welcome = $("f-bienvenida").value.trim();

      let textColor = texto;
      let titleColor = acento;
      let lineColor = acento;
      let yStart = 350;

      if (conMarco) {
        const fx = 135, fy = 56, fw = 330, fh = 370;
        if (estiloFondo === "boho") {
          ["#c07a58", "#deb496", "#ecdcc8"].forEach((clr, idx) => {
            const p = (3 - idx) * 14;
            g.fillStyle = clr;
            g.beginPath();
            g.arc(fx + fw / 2, fy + (fw / 2) - p * 0.2, (fw / 2) + p, Math.PI, 0);
            g.lineTo(fx + fw + p, fy + fh);
            g.lineTo(fx - p, fy + fh);
            g.closePath();
            g.fill();
          });
        }
        if (esPill) {
          g.fillStyle = "rgba(183,110,121,.35)";
          g.beginPath();
          g.roundRect(fx + 14, fy + 14, fw, fh, 165);
          g.fill();
        }
        g.save();
        g.beginPath();
        if (esOval) {
          g.ellipse(fx + fw / 2, fy + fh / 2, fw / 2, fh / 2, 0, 0, Math.PI * 2);
        } else if (esPill) {
          g.roundRect(fx, fy, fw, fh, 165);
        } else {
          const r = fw / 2;
          g.arc(fx + r, fy + r, r, Math.PI, 0);
          g.lineTo(fx + fw, fy + fh);
          g.lineTo(fx, fy + fh);
          g.closePath();
        }
        g.clip();
        if (im) dibujarCover(g, im, fx, fy, fw, fh);
        else { g.fillStyle = suave; g.fillRect(fx, fy, fw, fh); }
        g.restore();

        if (!["boho", "glam"].includes(estiloFondo)) {
          g.strokeStyle = acento;
          g.lineWidth = 2;
          g.beginPath();
          if (esOval) {
            g.ellipse(fx + fw / 2, fy + fh / 2, fw / 2 + 12, fh / 2 + 12, 0, 0, Math.PI * 2);
          } else {
            const r = fw / 2 + 12;
            g.arc(fx + fw / 2, fy + fw / 2, r, Math.PI, 0);
            g.lineTo(fx + fw + 12, fy + fh + 12);
            g.lineTo(fx - 12, fy + fh + 12);
            g.closePath();
          }
          g.stroke();
        }
        if (estiloFondo.startsWith("boda-")) titleColor = texto;
        yStart = 490;
      } else if (im) {
        dibujarCover(g, im, 0, 0, W, H);
        const grad = g.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, "rgba(0,0,0,.18)");
        grad.addColorStop(0.45, "rgba(0,0,0,.28)");
        grad.addColorStop(1, "rgba(0,0,0,.78)");
        g.fillStyle = grad;
        g.fillRect(0, 0, W, H);
        textColor = "#ffffff";
        titleColor = estiloFondo === "noche" ? acento : "#ffffff";
        yStart = 500;
      } else {
        const rg = g.createRadialGradient(W / 2, H * 0.35, 20, W / 2, H * 0.35, 360);
        rg.addColorStop(0, suave);
        rg.addColorStop(1, fondo);
        g.fillStyle = rg;
        g.fillRect(0, 0, W, H);
        yStart = 320;
      }

      if (["noche", "editorial", "artdeco", "filete"].includes(estiloFondo)) {
        g.strokeStyle = acento;
        g.globalAlpha = 0.65;
        g.lineWidth = 2;
        g.strokeRect(20, 20, W - 40, H - 40);
        g.globalAlpha = 1;
      }

      g.textAlign = "center";
      let y = yStart;
      if (im && !conMarco) {
        g.shadowColor = "rgba(0,0,0,.55)";
        g.shadowBlur = 14;
      }

      if (tipo) {
        g.fillStyle = textColor;
        g.font = "22px " + fTxt;
        g.fillText(tipo.toUpperCase().split("").join(" "), W / 2, y);
        y += 66;
      }

      let tam = 72;
      let lineas = [];
      do {
        g.font = pesoTit + tam + "px " + fTit;
        lineas = partirLineas(g, honoree, W - 90, 2);
        const maxW = Math.max(...lineas.map((l) => g.measureText(l).width), 0);
        if (maxW <= W - 90) break;
        tam -= 4;
      } while (tam > 32);

      g.fillStyle = titleColor;
      lineas.forEach((l) => {
        g.fillText(l, W / 2, y);
        y += tam * 1.1;
      });

      g.shadowBlur = 0;
      g.strokeStyle = lineColor;
      g.lineWidth = 2.5;
      g.beginPath();
      g.moveTo(W / 2 - 55, y - tam * 0.35);
      g.lineTo(W / 2 + 55, y - tam * 0.35);
      g.stroke();

      if (welcome) {
        y += 26;
        g.fillStyle = textColor;
        g.globalAlpha = 0.92;
        g.font = "italic 25px " + fTxt;
        partirLineas(g, welcome, W - 96, 2).forEach((l) => {
          g.fillText(l, W / 2, y);
          y += 32;
        });
        g.globalAlpha = 1;
      }

      let out = "";
      for (let q = 0.86; q >= 0.56; q -= 0.08) {
        out = c.toDataURL("image/webp", q);
        if (!out.startsWith("data:image/webp")) out = c.toDataURL("image/jpeg", q);
        if (out.length <= 95000) break;
      }
      return out;
    }

    async function actualizarPreviewMuestra() {
      if (!$("f-guardar-muestra").checked) {
        $("vista-muestra-tpl").hidden = true;
        muestraGenerada = "";
        return;
      }
      muestraGenerada = await generarMuestraPortada();
      $("vista-muestra-tpl").src = muestraGenerada;
      $("vista-muestra-tpl").hidden = false;
    }

    $("f-guardar-muestra").addEventListener("change", actualizarPreviewMuestra);
    ["f-template", "f-honoree", "f-tipo", "f-bienvenida"].forEach((id) => {
      $(id).addEventListener("input", () => { if ($("f-guardar-muestra").checked) actualizarPreviewMuestra(); });
      $(id).addEventListener("change", () => { if ($("f-guardar-muestra").checked) actualizarPreviewMuestra(); });
    });

    function verFotos(lista) {
      $("vista-fotos").innerHTML = "";
      lista.forEach((src) => {
        if (!/^(https:\/\/|data:image\/)/i.test(src)) return;
        const i = document.createElement("img"); i.src = src;
        $("vista-fotos").appendChild(i);
      });
    }

    $("f-fotos").addEventListener("change", async (e) => {
      const max = limites().maxPhotos;
      const elegidas = Array.from(e.target.files);
      const archivos = elegidas.slice(0, max);
      $("f-msg").textContent = "Procesando fotos...";
      try {
        fotos = [];
        for (let i = 0; i < archivos.length; i++) {
          fotos.push(await comprimir(archivos[i], i === 0));
        }
        verFotos(fotos);
        let t = fotos.length + " foto(s) nueva(s) lista(s)" + (editId ? " (reemplazan a las anteriores)." : ".");
        if (elegidas.length > max) {
          t += " Este paquete permite hasta " + max + " foto(s): se usaron las primeras.";
        }
        $("f-msg").textContent = t;
        if ($("f-guardar-muestra").checked) actualizarPreviewMuestra();
      } catch (err) {
        fotos = [];
        $("f-msg").textContent = "No se pudo leer una de las fotos.";
      }
    });

    function mostrarLugar2() { $("bloque-lugar2").hidden = !$("f-lugar2-on").checked; }
    $("f-lugar2-on").addEventListener("change", mostrarLugar2);
    $("form").addEventListener("reset", () => setTimeout(mostrarLugar2, 0));

    function salirDeEdicion() {
      editId = null; pedidoId = null; fotos = []; fotosExistentes = []; muestraGenerada = "";
      $("form").reset();
      $("vista-fotos").innerHTML = "";
      $("vista-muestra-tpl").hidden = true;
      $("titulo-form").textContent = "Nueva invitación";
      $("btn-crear").textContent = "Crear invitación";
      $("btn-cancelar").hidden = true;
      $("aviso-edicion").hidden = true;
      aplicarLimites();
    }
    $("btn-cancelar").addEventListener("click", () => { salirDeEdicion(); $("f-msg").textContent = ""; });

    function editar(id, x) {
      salirDeEdicion();
      editId = id;
      fotosExistentes = Array.isArray(x.photos) ? x.photos : [];
      $("f-paquete").value = x.package === "premium" ? "premium" : "basico";
      $("f-template").value = x.template || "cumple";
      $("f-honoree").value = x.honoree || "";
      $("f-tipo").value = x.eventType || "";
      $("f-fecha").value = x.date || "";
      $("f-hora").value = x.time || "";
      $("f-salon").value = x.venue || "";
      $("f-dir").value = x.address || "";
      $("f-maps").value = x.mapsUrl || "";
      $("f-lugar1-etq").value = x.venueLabel || "";
      $("f-lugar2-etq").value = x.venue2Label || "";
      $("f-hora2").value = x.venue2Time || "";
      $("f-salon2").value = x.venue2 || "";
      $("f-dir2").value = x.address2 || "";
      $("f-maps2").value = x.mapsUrl2 || "";
      $("f-lugar2-on").checked = !!(x.venue2 || x.address2);
      mostrarLugar2();
      $("f-bienvenida").value = x.welcome || "";
      $("f-mensaje").value = x.message || "";
      $("f-info").value = x.info || "";
      $("f-dress").value = x.dressCode || "";
      $("f-regalo").value = x.gift || "";
      $("f-whatsapp").value = x.whatsapp || "";
      $("f-musica").value = x.music || "";
      $("f-firma").checked = x.showBrand !== false;
      $("f-galeria").value = x.galleryType || "";
      aplicarLimites();
      verFotos(fotosExistentes);
      $("titulo-form").textContent = "Editar invitación";
      $("btn-crear").textContent = "Guardar cambios";
      $("btn-cancelar").hidden = false;
      let aviso = "Editando: " + id + ". Si no elegís fotos nuevas, se mantienen las actuales.";
      if (x.music && !limites().music) {
        aviso += " Ojo: este paquete no incluye música y se va a quitar al guardar. Cambiá a Premium para conservarla.";
      }
      $("aviso-edicion").textContent = aviso;
      $("aviso-edicion").hidden = false;
      $("f-msg").textContent = "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $("f-msg");
      const honoree = $("f-honoree").value.trim();
      const tipo = $("f-tipo").value.trim();
      const fecha = $("f-fecha").value;
      const maps = $("f-maps").value.trim();
      const musica = $("f-musica").value.trim();
      const l = limites();

      if (!honoree) { msg.textContent = "Falta el nombre del homenajeado."; return; }
      if (!fecha) { msg.textContent = "Falta la fecha."; return; }
      if (maps && !/^https:\/\//i.test(maps)) { msg.textContent = "El enlace de Maps debe empezar con https://"; return; }
      const dosLugares = $("f-lugar2-on").checked;
      const maps2 = dosLugares ? $("f-maps2").value.trim() : "";
      if (maps2 && !/^https:\/\//i.test(maps2)) { msg.textContent = "El enlace de Maps del segundo lugar debe empezar con https://"; return; }
      if (musica && !/^https:\/\//i.test(musica)) { msg.textContent = "El enlace de música debe empezar con https://"; return; }

      const fotosFinal = fotos.length ? fotos : fotosExistentes;
      if (fotosFinal.length > l.maxPhotos) {
        msg.textContent = "Este paquete permite hasta " + l.maxPhotos + " foto(s). Elegí menos o cambiá a Premium.";
        return;
      }
      if (fotosFinal.join("").length > 980000) {
        msg.textContent = "Las fotos pesan demasiado para una sola invitación. Usá menos fotos o más livianas.";
        return;
      }

      const guardarMuestra = $("f-guardar-muestra").checked;
      const tplId = $("f-template").value;
      const datos = {
        package: $("f-paquete").value,
        template: tplId,
        honoree: honoree,
        eventType: tipo,
        date: fecha,
        time: $("f-hora").value,
        venue: $("f-salon").value.trim(),
        address: $("f-dir").value.trim(),
        mapsUrl: maps,
        venueLabel: $("f-lugar1-etq").value.trim(),
        venue2Label: dosLugares ? $("f-lugar2-etq").value.trim() : "",
        venue2Time: dosLugares ? $("f-hora2").value : "",
        venue2: dosLugares ? $("f-salon2").value.trim() : "",
        address2: dosLugares ? $("f-dir2").value.trim() : "",
        mapsUrl2: maps2,
        welcome: $("f-bienvenida").value.trim(),
        message: $("f-mensaje").value.trim(),
        info: $("f-info").value.trim(),
        dressCode: $("f-dress").value.trim(),
        gift: $("f-regalo").value.trim(),
        whatsapp: $("f-whatsapp").value.trim(),
        music: l.music ? musica : "",
        photos: fotosFinal,
        galleryType: $("f-galeria").value,
        showBrand: $("f-firma").checked
      };

      $("btn-crear").disabled = true;
      msg.textContent = editId ? "Guardando..." : "Creando...";
      try {
        if (guardarMuestra) {
          muestraGenerada = await generarMuestraPortada();
          if (tplDatos[tplId]) {
            await updateDoc(doc(db, "templates", tplId), {
              sampleImage: muestraGenerada,
              updatedAt: serverTimestamp()
            });
            tplDatos[tplId].sampleImage = muestraGenerada;
          }
        }
        if (editId) {
          datos.updatedAt = serverTimestamp();
          await updateDoc(doc(db, "invitations", editId), datos);
          const id = editId;
          salirDeEdicion();
          msg.textContent = "Cambios guardados" + (guardarMuestra ? " y muestra actualizada" : "") + ". Enlace: " + linkDe(id);
        } else {
          let id = slug(honoree + " " + tipo) || "invitacion";
          const existe = await getDoc(doc(db, "invitations", id));
          if (existe.exists()) id += "-" + azar();
          datos.active = true;
          datos.ownerId = auth.currentUser.uid;
          datos.createdAt = serverTimestamp();
          await setDoc(doc(db, "invitations", id), datos);
          if (pedidoId) {
            try {
              await updateDoc(doc(db, "orders", pedidoId), {
                invitationId: id,
                updatedAt: serverTimestamp()
              });
            } catch (err) { console.error(err); }
          }
          salirDeEdicion();
          msg.textContent = "Creada" + (guardarMuestra ? " y muestra actualizada" : "") + ". Enlace: " + linkDe(id);
        }
        listar();
      } catch (err) {
        console.error(err);
        msg.textContent = "No se pudo guardar. Revisá que hayas entrado con la cuenta administradora.";
      }
      $("btn-crear").disabled = false;
    });

    async function duplicar(id, x) {
      try {
        const nuevo = (slug(x.honoree || id) || "invitacion") + "-copia-" + azar();
        const copia = { ...x, active: false, createdAt: serverTimestamp() };
        delete copia.updatedAt;
        await setDoc(doc(db, "invitations", nuevo), copia);
        $("f-msg").textContent = "Duplicada como " + nuevo + " (queda desactivada hasta que la actives).";
        listar();
      } catch (err) {
        console.error(err);
        $("f-msg").textContent = "No se pudo duplicar.";
      }
    }

    async function eliminar(id, x) {
      const ok = confirm("¿Eliminar la invitación de " + (x.honoree || id) +
        "? Se borran también sus confirmaciones y su registro de pago. No se puede deshacer.");
      if (!ok) return;
      try {
        const rs = await getDocs(query(collection(db, "rsvps"), where("invitationId", "==", id)));
        for (const r of rs.docs) await deleteDoc(r.ref);
        await deleteDoc(doc(db, "payments", id));
        await deleteDoc(doc(db, "invitations", id));
        if (editId === id) salirDeEdicion();
        $("f-msg").textContent = "Invitación eliminada.";
        listar();
      } catch (err) {
        console.error(err);
        $("f-msg").textContent = "No se pudo eliminar.";
      }
    }

    async function listar() {
      const cont = $("lista");
      cont.textContent = "Cargando...";
      try {
        const q = query(collection(db, "invitations"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        todas = snap.docs.map((d) => ({ id: d.id, x: d.data() }));
        pintar();
      } catch (err) {
        console.error(err);
        cont.textContent = "No se pudo cargar la lista.";
      }
    }

    function pintar() {
      const cont = $("lista");
      const txt = $("buscar").value.trim().toLowerCase();
      const plan = $("filtro").value;
      const lista = todas.filter(({ id, x }) =>
        (!plan || x.template === plan) &&
        (!txt || (x.honoree || "").toLowerCase().includes(txt) || id.includes(txt)));

      cont.textContent = "";
      if (!todas.length) { cont.textContent = "Todavía no hay invitaciones."; return; }
      if (!lista.length) { cont.textContent = "No hay resultados."; return; }

      lista.forEach(({ id, x }) => {
        const t = document.createElement("div"); t.className = "tarjeta";
        const n = document.createElement("b"); n.textContent = x.honoree || id;
        const est = document.createElement("div");
        est.textContent = (x.active ? "Activa" : "Desactivada") + " - " +
          (ETIQ_PAQ[x.package] || "Esencial") + " - " + (x.date || "");
        const a = document.createElement("a");
        a.href = linkDe(id); a.textContent = linkDe(id); a.target = "_blank";
        a.style.wordBreak = "break-all";

        const b = (texto, clase, fn) => {
          const el = document.createElement("button");
          el.type = "button"; el.textContent = texto;
          if (clase) el.className = clase;
          el.onclick = fn; return el;
        };
        const copiar = b("Copiar enlace", "", () =>
          navigator.clipboard.writeText(linkDe(id)).then(() => { copiar.textContent = "Copiado"; }));
        const conf = document.createElement("a");
        conf.href = "confirmaciones.html?i=" + encodeURIComponent(id);
        conf.textContent = "Ver confirmaciones";
        conf.style.display = "inline-block"; conf.style.margin = "8px 8px 0 0";

        t.append(n, est, a, document.createElement("br"),
          b("Editar", "", () => editar(id, x)),
          b("Duplicar", "sec", () => duplicar(id, x)),
          b(x.active ? "Desactivar" : "Activar", "sec", async () => {
            await updateDoc(doc(db, "invitations", id), { active: !x.active });
            listar();
          }),
          copiar,
          b("Eliminar", "rojo", () => eliminar(id, x)),
          document.createElement("br"), conf);
        cont.appendChild(t);
      });
    }

    $("buscar").addEventListener("input", pintar);
    $("filtro").addEventListener("change", pintar);
  </script>
  <script type="module" src="js/plantillas-select.js"></script>
</body>
