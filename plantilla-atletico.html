<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Plantilla Atlético Tucumán - KE Invitaciones</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0 auto;background:#fffaf3;color:#1a1a1a;font-family:Georgia,serif;padding:16px;max-width:560px}
    h1,h2{color:#c9a24b}
    input,select,button{width:100%;padding:12px;margin:5px 0;border:1px solid #d8cbb0;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff}
    input[type=checkbox]{width:auto;margin:0 8px 0 0}
    button{background:#c9a24b;color:#fff;border:0;cursor:pointer}
    button.sec{background:#1a1a1a}
    label{font-size:.9rem;display:block;margin-top:8px}
    .check{display:flex;align-items:center;margin:10px 0}
    a{color:#c9a24b}
    .caja{background:#fff;border:1px solid #eadfc8;border-radius:12px;padding:14px;margin:12px 0}
    .preview{
      position:relative;border-radius:14px;padding:14px;margin:10px 0;text-align:center;color:#10263b;
      background-color:#ffffff;
      background-image:repeating-linear-gradient(90deg, #ffffff 0 32px, #dcf0fb 32px 64px);
      border:1px solid rgba(184,139,46,.45);
    }
    .preview-in{
      background:radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.92) 30%, rgba(255,255,255,.65) 85%);
      border:1px solid rgba(184,139,46,.7);
      border-radius:10px;padding:24px 14px;
    }
    .preview small{display:block;letter-spacing:3px;text-transform:uppercase;font-size:.72rem;color:#b88b2e;font-weight:600;margin-bottom:6px}
    .preview h2{margin:4px 0 8px;font-size:1.7rem;color:#10263b;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
    .preview .raya{width:70px;height:1px;background:#b88b2e;margin:10px auto}
    .preview p{margin:0 0 16px;font-size:.92rem;color:#10263b}
    .preview .muestra-btn{display:inline-block;background:#b88b2e;color:#fff;padding:10px 22px;border-radius:999px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
    .colores{display:flex;gap:6px;margin-top:10px}
    .colores span{flex:1;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.12)}
    .aviso{background:#f6dde2;border-radius:10px;padding:10px 12px;margin:8px 0}
    .msg{min-height:1.4em}
  </style>
</head>
<body>
  <h1>Plantilla Atlético Tucumán</h1>
  <p><a href="plantillas.html">Plantillas</a> - <a href="admin.html">Invitaciones</a> - <a href="dashboard.html">Menú</a></p>

  <section id="login">
    <input id="email" type="email" placeholder="Email de administrador" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btn-login" type="button">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="panel" hidden>
    <p>Sesión: <b id="sesion-email"></b></p>
    <button id="btn-salir" class="sec" type="button">Cerrar sesión</button>
    <p id="admin-aviso" class="aviso" hidden></p>

    <div id="contenido" class="caja">
      <div id="preview" class="preview">
        <div class="preview-in">
          <small>★ Están todos invitados ★</small>
          <h2 id="pv-tit">Fiesta Decana</h2>
          <div class="raya"></div>
          <p id="pv-txt">Blanco, celeste y detalles en oro para celebrar a lo grande.</p>
          <span id="pv-btn" class="muestra-btn">Confirmar asistencia</span>
        </div>
      </div>

      <div class="colores">
        <span style="background:#ffffff" title="Blanco #ffffff"></span>
        <span style="background:#bfe5f8" title="Celeste #bfe5f8"></span>
        <span style="background:#b88b2e" title="Dorado #b88b2e"></span>
        <span style="background:#10263b" title="Texto marino #10263b"></span>
      </div>

      <label>Nombre de la plantilla</label>
      <input id="f-nombre" value="Gala Decana (Atlético Tucumán)" maxlength="60">

      <label>Categoría</label>
      <select id="f-cat"></select>

      <label class="check"><input id="f-home" type="checkbox">Mostrar en la página principal (Nuestros Diseños)</label>

      <button id="btn-cargar" type="button">Guardar plantilla Atlético Tucumán</button>
      <p id="msg" class="msg"></p>
    </div>
  </section>

  <script type="module">
    import { db, auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, getDoc, setDoc, updateDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { buscarFuente, cargarFuente } from "./js/fuentes.js";

    const $ = (id) => document.getElementById(id);
    const ADMIN_UID = "Ivb1LtWt6Eb8GkanORvC3C0Qx943";
    const TODAS = ["portada", "mensaje", "cuenta", "lugar", "info", "galeria", "rsvp", "compartir"];
    const CATEGORIAS_BASE = [
      ["especial", "Eventos especiales"], ["cumpleanos", "Cumpleaños infantiles"],
      ["quince", "15 años"], ["boda", "Casamientos"], ["bautismo", "Bautismos"],
      ["babyshower", "Baby shower"], ["aniversario", "Aniversarios"]
    ];

    const FONTS = {
      titulo: "'Outfit', sans-serif",
      texto: "'Plus Jakarta Sans', sans-serif",
      boton: "'Montserrat', sans-serif"
    };
    Object.values(FONTS).forEach((css) => cargarFuente(buscarFuente(css)));
    $("preview").style.fontFamily = FONTS.texto;
    $("pv-tit").style.fontFamily = FONTS.titulo;
    $("pv-btn").style.fontFamily = FONTS.boton;

    $("btn-login").addEventListener("click", async () => {
      $("login-msg").textContent = "Entrando...";
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("clave").value);
        $("login-msg").textContent = "";
      } catch (e) { $("login-msg").textContent = "Email o contraseña incorrectos."; }
    });
    $("btn-salir").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (u) => {
      if (!u || u.isAnonymous) {
        $("login").hidden = false;
        $("panel").hidden = true;
        return;
      }
      $("login").hidden = true;
      $("panel").hidden = false;
      $("sesion-email").textContent = u.email || u.uid;
      if (u.uid !== ADMIN_UID) {
        $("admin-aviso").textContent = "Iniciaste sesión con otra cuenta (" + (u.email || u.uid) + "), no con la cuenta administradora. Tocá \"Cerrar sesión\" y entrá como administrador.";
        $("admin-aviso").hidden = false;
        $("contenido").hidden = true;
        return;
      }
      $("admin-aviso").hidden = true;
      $("contenido").hidden = false;
      cargarCategorias();
    });

    async function cargarCategorias() {
      let lista = CATEGORIAS_BASE;
      try {
        const s = await getDoc(doc(db, "settings", "categories"));
        if (s.exists() && Array.isArray(s.data().items) && s.data().items.length) {
          lista = s.data().items
            .filter((c) => c && typeof c.id === "string" && typeof c.name === "string" && c.id !== "pase")
            .map((c) => [c.id, c.name]);
        }
      } catch (e) { console.error(e); }

      const sel = $("f-cat");
      sel.innerHTML = "";
      lista.forEach(([id, nom]) => {
        const o = document.createElement("option");
        o.value = id; o.textContent = nom;
        sel.appendChild(o);
      });
      if (lista.some(([id]) => id === "especial")) sel.value = "especial";
    }

    $("btn-cargar").addEventListener("click", async () => {
      const nombre = $("f-nombre").value.trim() || "Gala Decana (Atlético Tucumán)";
      const btn = $("btn-cargar");
      btn.disabled = true;
      $("msg").textContent = "Guardando plantilla...";
      try {
        const ref = doc(db, "templates", "atletico-tucuman-pro");
        const ex = await getDoc(ref);
        const diseno = {
          name: nombre,
          category: $("f-cat").value || "especial",
          showHome: $("f-home").checked,
          font: FONTS.texto,
          fonts: FONTS,
          tamanos: { titulo: 100, subtitulo: 100, info: 100, boton: 100 },
          colors: {
            fondo: "#ffffff",
            texto: "#10263b",
            acento: "#b88b2e",
            suave: "#bfe5f8"
          },
          fondo: "franjas",
          patron: "",
          marco: "",
          deco: "estrellas",
          efectos: ["titulos"],
          sections: TODAS
        };
        if (ex.exists()) {
          diseno.updatedAt = serverTimestamp();
          await updateDoc(ref, diseno);
          $("msg").textContent = "Plantilla actualizada (atletico-tucuman-pro). Ya podés usarla en admin.html.";
        } else {
          diseno.sampleImage = "";
          diseno.active = true;
          diseno.createdAt = serverTimestamp();
          await setDoc(ref, diseno);
          $("msg").textContent = "Plantilla creada (atletico-tucuman-pro). Ya podés elegirla en admin.html.";
        }
      } catch (e) {
        console.error(e);
        $("msg").textContent = "No se pudo guardar.";
      }
      btn.disabled = false;
    });
  </script>
</body>
  </html>
