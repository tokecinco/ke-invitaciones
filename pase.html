<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pase de acceso</title>
  <style>
    :root{--ac:#c9a24b}
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(160deg,#14110f,#2b221b);color:#1a1a1a;
      font-family:Georgia,serif;padding:22px 16px 40px;text-align:center}
    main{max-width:380px;margin:0 auto}
    .logo{color:var(--ac);letter-spacing:3px;margin-bottom:14px}
    #estado{color:#fff;padding:30px 10px}
    .ticket{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45);
      animation:entra .7s ease}
    @keyframes entra{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
    .banner{height:150px;background-size:cover;background-position:center}
    .cuerpo{padding:22px 20px 20px}
    .tipo{margin:0;font-size:.75rem;letter-spacing:3px;text-transform:uppercase;color:#777}
    .chip{display:inline-block;margin-left:6px;padding:2px 10px;border-radius:12px;background:var(--ac);
      color:#fff;letter-spacing:1px}
    h1{margin:8px 0 6px;font-size:1.7rem;font-weight:normal;color:var(--ac);line-height:1.15}
    .dato{margin:3px 0;font-size:.95rem}
    .link{color:var(--ac);font-size:.9rem}
    .corte{position:relative;border-top:2px dashed #ddd;margin:20px -20px}
    .corte::before,.corte::after{content:"";position:absolute;top:-12px;width:22px;height:22px;
      border-radius:50%;background:#1d1713}
    .corte::before{left:-11px}
    .corte::after{right:-11px}
    .etq{margin:0;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:#888}
    #nombre{margin:2px 0 0;font-size:1.5rem}
    #entradas{margin:2px 0 10px}
    .mesa{background:#faf3e0;border:1px solid var(--ac);border-radius:14px;padding:8px 12px;margin:0 auto 12px;
      max-width:220px}
    .mesa span{display:block;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:#888}
    .mesa b{font-size:1.8rem;color:var(--ac)}
    #qr{width:230px;height:230px;max-width:100%;image-rendering:pixelated}
    .ayuda{margin:6px 0 0;font-size:.85rem;color:#777}
    .usado{background:#2e9e57;color:#fff;border-radius:10px;padding:8px;margin:0 0 12px;font-size:.9rem}
    .botones{display:flex;gap:8px;margin-top:16px}
    .botones button,.botones a{flex:1;padding:13px;border:0;border-radius:30px;background:var(--ac);
      color:#fff;font-family:inherit;font-size:1rem;text-decoration:none;cursor:pointer}
    #btn-mas{width:100%;margin-top:10px;padding:13px;border:1px solid var(--ac);border-radius:30px;
      background:transparent;color:var(--ac);font-family:inherit;font-size:1rem;cursor:pointer}

    .fondo{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;
      align-items:flex-end;justify-content:center}
    .hoja{background:#fff;color:#1a1a1a;width:100%;max-width:480px;max-height:86vh;overflow:auto;
      border-radius:22px 22px 0 0;padding:18px 18px 28px;text-align:left;animation:sube .35s ease}
    @keyframes sube{from{transform:translateY(100%)}to{transform:none}}
    .cab{display:flex;align-items:center;justify-content:space-between}
    .cab h2{margin:0;color:var(--ac);font-weight:normal;font-size:1.3rem}
    .cab button{width:38px;height:38px;border-radius:50%;border:0;background:#f1ece0;font-size:1.5rem;
      line-height:1;cursor:pointer}
    .hoja h3{margin:18px 0 6px;font-size:.85rem;letter-spacing:2px;text-transform:uppercase;color:#8a6a1f;
      font-weight:normal}
    .hoja p{margin:0}
    .it{display:grid;grid-template-columns:62px 1fr;gap:6px 10px;font-size:.95rem}
    .it b{color:var(--ac);text-align:right}
    .mini{width:100%;border-radius:10px;cursor:zoom-in;display:block}
    .galeria{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .galeria img{width:100%;height:110px;object-fit:cover;border-radius:10px;cursor:zoom-in}
    .cal{width:100%;margin-top:18px;padding:13px;border:0;border-radius:30px;background:var(--ac);
      color:#fff;font-family:inherit;font-size:1rem;cursor:pointer}

    .grande{position:fixed;inset:0;z-index:80;background:#fff;color:#1a1a1a;display:flex;
      flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto}
    .grande img{max-width:min(94vw,520px);max-height:80vh;height:auto}
    .grande img.qr{width:min(90vw,440px);image-rendering:pixelated}
    .grande p{margin:14px 0 0;font-size:1.1rem}
  </style>
</head>
<body>
  <main>
    <div class="logo">KE INVITACIONES</div>
    <p id="estado">Cargando tu pase...</p>

    <div id="ticket" class="ticket" hidden>
      <div id="banner" class="banner" hidden></div>
      <div class="cuerpo">
        <p class="tipo"><span>Pase de acceso</span><span id="chip" class="chip" hidden></span></p>
        <h1 id="evento"></h1>
        <p id="fecha" class="dato"></p>
        <p id="lugar" class="dato"></p>
        <p id="info" class="dato" hidden></p>
        <a id="mapa" class="link" target="_blank" rel="noopener" hidden>Ver ubicación</a>
        <div class="corte"></div>
        <div id="usado" class="usado" hidden></div>
        <p class="etq">A nombre de</p>
        <p id="nombre"></p>
        <p id="entradas"></p>
        <div id="mesa" class="mesa" hidden><span>Tu mesa</span><b id="mesa-n"></b></div>
        <img id="qr" alt="Código QR de acceso">
        <p class="ayuda">Mostrá este código en la entrada</p>
      </div>
    </div>

    <div id="botones" class="botones" hidden>
      <button id="btn-ampliar" type="button">Ampliar QR</button>
      <a id="btn-guardar" download="pase.png">Guardar QR</a>
    </div>
    <button id="btn-mas" type="button" hidden>Más información del evento</button>
  </main>

  <script type="module">
    import { db } from "./js/firebase.js";
    import { doc, getDoc }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    const p = new URLSearchParams(location.search);
    const idInv = p.get("i");
    const idG = p.get("g");
    const imgOk = (s) => typeof s === "string" && /^(https:\/\/|data:image\/)/i.test(s);

    function aviso(t) { $("estado").textContent = t; }

    function cargarQR() {
      return new Promise((ok, mal) => {
        if (window.qrcode) return ok();
        const s = document.createElement("script");
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
        s.onload = ok;
        s.onerror = () => mal(new Error("qr"));
        document.head.appendChild(s);
      });
    }
    function dibujarQR(texto) {
      const qr = window.qrcode(0, "M");
      qr.addData(texto); qr.make();
      const n = qr.getModuleCount(), celda = 10, margen = 4, lado = (n + margen * 2) * celda;
      const c = document.createElement("canvas");
      c.width = lado; c.height = lado;
      const g = c.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, lado, lado);
      g.fillStyle = "#000";
      for (let f = 0; f < n; f++) for (let k = 0; k < n; k++) {
        if (qr.isDark(f, k)) g.fillRect((k + margen) * celda, (f + margen) * celda, celda, celda);
      }
      return c.toDataURL("image/png");
    }

    function ampliar(src, texto, esQR) {
      const f = document.createElement("div");
      f.className = "grande";
      const im = document.createElement("img");
      im.src = src; im.alt = texto || "";
      if (esQR) im.className = "qr";
      const t = document.createElement("p");
      t.textContent = (texto ? texto + " - " : "") + "tocá para cerrar";
      f.append(im, t);
      f.addEventListener("click", () => f.remove());
      document.body.appendChild(f);
    }

    function archivoCalendario(d) {
      const ini = new Date(d.date + "T" + (d.time || "00:00") + ":00");
      if (isNaN(ini)) return null;
      const fin = new Date(ini.getTime() + 4 * 3600 * 1000);
      const f = (x) => x.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
      const esc = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
      return [
        "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//KE Invitaciones//ES", "BEGIN:VEVENT",
        "UID:" + idInv + "-" + idG + "@ke-invitaciones",
        "DTSTAMP:" + f(new Date()), "DTSTART:" + f(ini), "DTEND:" + f(fin),
        "SUMMARY:" + esc(d.honoree || "Evento"),
        "LOCATION:" + esc([d.venue, d.address].filter(Boolean).join(" - ")),
        "DESCRIPTION:" + esc(d.info || ""), "END:VEVENT", "END:VCALENDAR"
      ].join("\r\n");
    }

    async function cargar() {
      if (!idInv || !idG) return aviso("Este enlace no es válido.");
      try {
        const [inv, gs] = await Promise.all([
          getDoc(doc(db, "invitations", idInv)),
          getDoc(doc(db, "guests", idG))
        ]);
        if (!inv.exists() || !gs.exists() || inv.data().active !== true || gs.data().invitationId !== idInv) {
          return aviso("Este pase no está disponible.");
        }
        await mostrar(inv.data(), gs.data());
      } catch (e) {
        console.error(e);
        aviso("Este pase no está disponible.");
      }
    }

    async function mostrar(d, g) {
      const premium = d.passTier === "premium";
      if (/^#[0-9a-f]{6}$/i.test(d.accent || "")) {
        document.documentElement.style.setProperty("--ac", d.accent);
      }
      document.title = (d.honoree || "Evento") + " - Pase";
      $("evento").textContent = d.honoree || "Evento";

      const fotos = Array.isArray(d.photos) ? d.photos.filter(imgOk) : [];
      if (premium && fotos[0]) {
        $("banner").style.backgroundImage = 'url("' + fotos[0] + '")';
        $("banner").hidden = false;
      }

      const fecha = d.date ? new Date(d.date + "T" + (d.time || "00:00") + ":00") : null;
      if (fecha && !isNaN(fecha)) {
        let f = fecha.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        f = f.charAt(0).toUpperCase() + f.slice(1);
        $("fecha").textContent = f + (d.time ? " - " + d.time + " hs" : "");
      }
      $("lugar").textContent = [d.venue, d.address].filter(Boolean).join(" - ");
      if (d.info) { $("info").textContent = d.info; $("info").hidden = false; }
      if (typeof d.mapsUrl === "string" && /^https:\/\//i.test(d.mapsUrl)) {
        $("mapa").href = d.mapsUrl; $("mapa").hidden = false;
      }

      $("nombre").textContent = g.name;
      $("entradas").textContent = g.seats === 1 ? "1 entrada" : g.seats + " entradas";

      if (premium) {
        if (g.ticketType) { $("chip").textContent = g.ticketType; $("chip").hidden = false; }
        if (g.table) { $("mesa-n").textContent = g.table; $("mesa").hidden = false; }
      }

      if (g.checkedIn) {
        const h = g.checkedInAt && g.checkedInAt.toDate
          ? g.checkedInAt.toDate().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }) : "";
        $("usado").textContent = "Este pase ya fue utilizado" + (h ? " a las " + h : "");
        $("usado").hidden = false;
      }

      const base = location.origin + location.pathname.replace(/[^/]*$/, "");
      const url = base + "acceso.html?i=" + encodeURIComponent(idInv) + "&g=" + encodeURIComponent(idG);
      await cargarQR();
      const png = dibujarQR(url);
      $("qr").src = png;
      $("btn-guardar").href = png;
      $("btn-guardar").download = "pase-" + idG + ".png";
      $("btn-ampliar").addEventListener("click", () => ampliar(png, g.name, true));

      if (premium) masInformacion(d, fotos);

      $("estado").hidden = true;
      $("ticket").hidden = false;
      $("botones").hidden = false;
    }

    function masInformacion(d, fotos) {
      const itinerario = (Array.isArray(d.itinerary) ? d.itinerary : []).filter((x) => x && x.title);
      const ics = archivoCalendario(d);
      const galeria = fotos.slice(1);
      const hay = d.hostMessage || itinerario.length || imgOk(d.planImage) || galeria.length || ics;
      if (!hay) return;
      $("btn-mas").hidden = false;
      $("btn-mas").addEventListener("click", () => {
        const fondo = document.createElement("div");
        fondo.className = "fondo";
        const hoja = document.createElement("div");
        hoja.className = "hoja";
        const cab = document.createElement("div");
        cab.className = "cab";
        const h2 = document.createElement("h2");
        h2.textContent = "Información del evento";
        const x = document.createElement("button");
        x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Cerrar");
        cab.append(h2, x);
        hoja.appendChild(cab);

        const titulo = (t) => { const h = document.createElement("h3"); h.textContent = t; hoja.appendChild(h); };

        if (d.hostMessage) {
          titulo("Mensaje del anfitrión");
          const m = document.createElement("p"); m.textContent = d.hostMessage; hoja.appendChild(m);
        }
        if (itinerario.length) {
          titulo("Itinerario");
          const it = document.createElement("div"); it.className = "it";
          itinerario.sort((a, b) => String(a.time || "").localeCompare(String(b.time || "")));
          itinerario.forEach((i) => {
            const h = document.createElement("b"); h.textContent = i.time || "";
            const t = document.createElement("span"); t.textContent = i.title;
            it.append(h, t);
          });
          hoja.appendChild(it);
        }
        if (imgOk(d.planImage)) {
          titulo("Plano del salón");
          const im = document.createElement("img");
          im.className = "mini"; im.src = d.planImage; im.alt = "Plano del salón";
          im.addEventListener("click", () => ampliar(d.planImage, "Plano del salón", false));
          hoja.appendChild(im);
        }
        if (galeria.length) {
          titulo("Fotos del evento");
          const gal = document.createElement("div"); gal.className = "galeria";
          galeria.forEach((s, i) => {
            const im = document.createElement("img");
            im.src = s; im.alt = "Foto " + (i + 1); im.loading = "lazy";
            im.addEventListener("click", () => ampliar(s, "", false));
            gal.appendChild(im);
          });
          hoja.appendChild(gal);
        }
        if (ics) {
          const b = document.createElement("button");
          b.type = "button"; b.className = "cal"; b.textContent = "Agregar al calendario";
          b.addEventListener("click", () => {
            const blob = new Blob([ics], { type: "text/calendar" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "evento.ics";
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 10000);
          });
          hoja.appendChild(b);
        }

        fondo.appendChild(hoja);
        document.body.appendChild(fondo);
        const cerrar = () => fondo.remove();
        x.addEventListener("click", cerrar);
        fondo.addEventListener("click", (e) => { if (e.target === fondo) cerrar(); });
      });
    }

    cargar();
  </script>
</body>
</html>
