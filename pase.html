<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pase Digital - Código QR</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .tarjeta-pase {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        .tarjeta-pase h2 {
            margin-bottom: 5px;
            color: #333;
        }
        .tarjeta-pase p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        #codigo-qr-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }
        .detalles-invitado {
            background: #f9fafb;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: left;
        }
        .detalles-invitado p {
            margin: 8px 0;
            color: #444;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="tarjeta-pase" id="seccion-pase-qr">
        <h2>Pase de Acceso</h2>
        <p>Presenta este código QR en la entrada</p>
        
        <!-- Contenedor del QR -->
        <div id="codigo-qr-container">
            <span id="texto-cargando">Generando QR...</span>
        </div>

        <!-- Datos del invitado -->
        <div class="detalles-invitado">
            <p><strong>Invitado:</strong> <span id="nombre-invitado">Cargando...</span></p>
            <p><strong>Pases asignados:</strong> <span id="cantidad-pases">--</span></p>
        </div>
    </div>

    <!-- Firebase SDK (necesario para leer los datos de la base de datos) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Librería para generar el código QR fácilmente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Tu archivo de lógica -->
    <script src="js/pase.js"></script>
</body>
</html>
